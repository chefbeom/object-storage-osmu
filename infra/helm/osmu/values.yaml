nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

config:
  mariadbDatabase: osmu
  springProfilesActive: local
  serverPort: "8080"
  flywayEnabled: "true"
  adminLoginId: admin
  adminEmail: admin@example.com
  adminName: Admin
  jwtAccessTokenTtlSeconds: "3600"
  jwtRefreshTokenTtlSeconds: "604800"
  metadataMode: mariadb
  storageMode: minio
  storageEndpoint: http://osmu-minio:9000
  storageCorsEnabled: "true"
  storageCorsAllowedOrigins: http://localhost:5173,http://127.0.0.1:5173
  uploadCleanupEnabled: "true"
  uploadCleanupInitialDelayMs: "60000"
  uploadCleanupFixedDelayMs: "300000"
  uploadCleanupBatchSize: "100"
  objectRetentionEnabled: "true"
  objectRetentionDays: "30"
  objectRetentionInitialDelayMs: "120000"
  objectRetentionFixedDelayMs: "3600000"
  objectRetentionBatchSize: "100"
  accessKeyProvisioningMode: minio
  accessKeyMcPath: mc
  accessKeyMinioAlias: osmu-minio
  s3PublicEndpoint: https://osmu.local/api/s3
  s3Region: us-east-1
  s3SigV4ClockSkewSeconds: "900"
  s3VirtualHostedStyleEnabled: "true"
  s3VirtualHostedStyleDomainSuffixes: localhost
  operationsReadinessConvergenceReportPath: .osmu-run/latest-operations-readiness-convergence.json
  kubernetesOperationsReportSyncReportPath: .osmu-run/latest-kubernetes-operations-report-sync.json

secrets:
  create: false
  name: osmu-secret
  values:
    mariadbUser: osmu
    mariadbPassword: change-me
    mariadbRootPassword: change-me
    minioRootUser: osmuadmin
    minioRootPassword: change-me
    adminPassword: change-me
    jwtSecret: change-me-at-least-32-bytes
    accessKeySecretEncryptionKey: change-me-32-byte-key

mariadb:
  image:
    repository: mariadb
    tag: "11.4"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    size: 10Gi

minio:
  # Default chart mode keeps the lightweight single StatefulSet used by the MVP.
  # Set tenant.enabled=true after installing MinIO Operator and validating the
  # target Tenant CRD version.
  tenant:
    enabled: false
    name: osmu-minio
    requestAutoCert: false
  pools:
    - name: pool-0
      servers: 4
      volumesPerServer: 4
      size: 1Ti
      storageClassName: ""
      volumeClaimName: data
      resources: {}
  image:
    repository: minio/minio
    tag: RELEASE.2025-05-24T17-08-30Z
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  persistence:
    size: 50Gi

storageExpansion:
  runner:
    rbac:
      # Disabled by default because normal OSMU backend pods do not need
      # Kubernetes API credentials. Enable only for an explicitly approved
      # in-cluster kubectl runner path.
      enabled: false
      serviceAccountName: osmu-storage-expansion-runner
      tenantName: osmu-minio
      legacyStatefulSetName: osmu-minio

backup:
  enabled: true
  retentionDays: "7"
  persistence:
    size: 50Gi
  mariadb:
    schedule: "0 18 * * *"
  minio:
    schedule: "30 18 * * *"
    mcImage:
      repository: minio/mc
      tag: RELEASE.2025-05-21T01-59-54Z
      pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ha:
  podDisruptionBudgets:
    enabled: true
    backend:
      minAvailable: 1
    frontend:
      minAvailable: 1
    mariadb:
      minAvailable: 1
    minio:
      minAvailable: 1
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

backend:
  replicas: 2
  metrics:
    enabled: true
    path: /actuator/prometheus
    port: "8080"
  image:
    repository: osmu-backend
    tag: local
    pullPolicy: IfNotPresent
  operationsReports:
    enabled: true
    type: configMap
    configMapName: osmu-operations-reports
    claimName: ""
    optional: true
    mountPath: /app/.osmu-run
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  replicas: 2
  image:
    repository: osmu-frontend
    tag: local
    pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  enabled: true
  className: ""
  host: osmu.local
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "220m"
  tls:
    - hosts:
        - osmu.local
      secretName: osmu-tls

networkPolicy:
  enabled: true
  dns:
    namespaceName: kube-system
    podLabelKey: k8s-app
    podLabelValue: kube-dns

monitoring:
  operator:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    releaseLabel: prometheus


