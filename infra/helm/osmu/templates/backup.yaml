{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "osmu.fullname" . }}-backup
  namespace: {{ include "osmu.namespace" . }}
  labels:
    app.kubernetes.io/name: osmu-backup
    {{- include "osmu.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "osmu.fullname" . }}-backup-data
  namespace: {{ include "osmu.namespace" . }}
  labels:
    app.kubernetes.io/name: osmu-backup
    {{- include "osmu.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size | quote }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "osmu.fullname" . }}-mariadb-backup
  namespace: {{ include "osmu.namespace" . }}
  labels:
    app.kubernetes.io/name: osmu-backup
    app.kubernetes.io/component: mariadb-backup
    {{- include "osmu.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.mariadb.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: osmu-backup
            app.kubernetes.io/component: mariadb-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/part-of: osmu
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "osmu.fullname" . }}-backup
          automountServiceAccountToken: false
          securityContext:
{{ toYaml .Values.backup.podSecurityContext | indent 12 }}
          containers:
            - name: mariadb-backup
              image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
              imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  target="/backup/mariadb/${timestamp}"
                  mkdir -p "$target"
                  mariadb-dump --single-transaction --routines --triggers \
                    -hosmu-mariadb \
                    -u"$MARIADB_USER" \
                    --password="$MARIADB_PASSWORD" \
                    "$MARIADB_DATABASE" > "$target/metadata.sql"
                  sha256sum "$target/metadata.sql" > "$target/metadata.sql.sha256"
                  find /backup/mariadb -mindepth 1 -maxdepth 1 -type d -mtime +"${OSMU_BACKUP_RETENTION_DAYS}" -exec rm -rf {} +
              env:
                - name: MARIADB_DATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "osmu.fullname" . }}-config
                      key: MARIADB_DATABASE
                - name: MARIADB_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "osmu.secretName" . }}
                      key: MARIADB_USER
                - name: MARIADB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "osmu.secretName" . }}
                      key: MARIADB_PASSWORD
                - name: OSMU_BACKUP_RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
              securityContext:
{{ toYaml .Values.backup.containerSecurityContext | indent 16 }}
              resources:
{{ toYaml .Values.backup.resources | indent 16 }}
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
          volumes:
            - name: backup-data
              persistentVolumeClaim:
                claimName: {{ include "osmu.fullname" . }}-backup-data
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "osmu.fullname" . }}-minio-backup
  namespace: {{ include "osmu.namespace" . }}
  labels:
    app.kubernetes.io/name: osmu-backup
    app.kubernetes.io/component: minio-backup
    {{- include "osmu.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.minio.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: osmu-backup
            app.kubernetes.io/component: minio-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/part-of: osmu
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "osmu.fullname" . }}-backup
          automountServiceAccountToken: false
          securityContext:
{{ toYaml .Values.backup.podSecurityContext | indent 12 }}
          containers:
            - name: minio-backup
              image: "{{ .Values.backup.minio.mcImage.repository }}:{{ .Values.backup.minio.mcImage.tag }}"
              imagePullPolicy: {{ .Values.backup.minio.mcImage.pullPolicy }}
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  target="/backup/minio/${timestamp}"
                  mkdir -p "$target"
                  mc alias set osmu http://osmu-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
                  mc mirror --overwrite osmu "$target"
                  find /backup/minio -mindepth 1 -maxdepth 1 -type d -mtime +"${OSMU_BACKUP_RETENTION_DAYS}" -exec rm -rf {} +
              env:
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "osmu.secretName" . }}
                      key: MINIO_ROOT_USER
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "osmu.secretName" . }}
                      key: MINIO_ROOT_PASSWORD
                - name: OSMU_BACKUP_RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
              securityContext:
{{ toYaml .Values.backup.containerSecurityContext | indent 16 }}
              resources:
{{ toYaml .Values.backup.resources | indent 16 }}
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
          volumes:
            - name: backup-data
              persistentVolumeClaim:
                claimName: {{ include "osmu.fullname" . }}-backup-data
{{- end }}
