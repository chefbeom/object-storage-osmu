apiVersion: v1
kind: Service
metadata:
  name: osmu-backend
  namespace: {{ include "osmu.namespace" . }}
  labels:
    app.kubernetes.io/name: osmu-backend
    {{- include "osmu.labels" . | nindent 4 }}
{{ if .Values.backend.metrics.enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: {{ .Values.backend.metrics.path | quote }}
    prometheus.io/port: {{ .Values.backend.metrics.port | quote }}
{{ end }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: osmu-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osmu-backend
  namespace: {{ include "osmu.namespace" . }}
  labels:
    app.kubernetes.io/name: osmu-backend
    {{- include "osmu.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: osmu-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osmu-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: osmu
    spec:
      securityContext:
{{ toYaml .Values.backend.podSecurityContext | indent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.backend.containerSecurityContext | indent 12 }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "osmu.fullname" . }}-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mariadb://osmu-mariadb:3306/$(MARIADB_DATABASE)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: MARIADB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: MARIADB_PASSWORD
            - name: OSMU_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: MINIO_ROOT_USER
            - name: OSMU_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: MINIO_ROOT_PASSWORD
            - name: OSMU_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: OSMU_ADMIN_PASSWORD
            - name: OSMU_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: OSMU_JWT_SECRET
            - name: OSMU_ACCESS_KEY_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: OSMU_ACCESS_KEY_SECRET_ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}

