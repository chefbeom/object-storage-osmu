apiVersion: v1
kind: Service
metadata:
  name: osmu-backend
  namespace: {{ include "osmu.namespace" . }}
  labels:
    app.kubernetes.io/name: osmu-backend
    {{- include "osmu.labels" . | nindent 4 }}
{{ if .Values.backend.metrics.enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: {{ .Values.backend.metrics.path | quote }}
    prometheus.io/port: {{ .Values.backend.metrics.port | quote }}
{{ end }}
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: osmu-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osmu-backend
  namespace: {{ include "osmu.namespace" . }}
  labels:
    app.kubernetes.io/name: osmu-backend
    {{- include "osmu.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: osmu-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osmu-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: osmu
    spec:
      serviceAccountName: osmu-backend
      automountServiceAccountToken: false
{{- if .Values.backend.mcTools.enabled }}
      initContainers:
        - name: install-mc-tools
          image: "{{ .Values.backend.mcTools.image.repository }}:{{ .Values.backend.mcTools.image.tag }}"
          imagePullPolicy: {{ .Values.backend.mcTools.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - cp "$(command -v mc)" "{{ .Values.backend.mcTools.mountPath }}/mc" && chmod 0555 "{{ .Values.backend.mcTools.mountPath }}/mc"
          securityContext:
{{ toYaml .Values.backend.containerSecurityContext | indent 12 }}
          volumeMounts:
            - name: mc-tools
              mountPath: {{ .Values.backend.mcTools.mountPath | quote }}
{{- end }}
{{- if .Values.ha.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.ha.topologySpread.maxSkew }}
          topologyKey: {{ .Values.ha.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.ha.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: osmu-backend
              app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
      securityContext:
{{ toYaml .Values.backend.podSecurityContext | indent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.backend.containerSecurityContext | indent 12 }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "osmu.fullname" . }}-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mariadb://osmu-mariadb:3306/$(MARIADB_DATABASE)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: MARIADB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: MARIADB_PASSWORD
            - name: OSMU_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: MINIO_ROOT_USER
            - name: OSMU_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: MINIO_ROOT_PASSWORD
            - name: OSMU_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: OSMU_ADMIN_PASSWORD
            - name: OSMU_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: OSMU_JWT_SECRET
            - name: OSMU_ACCESS_KEY_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "osmu.secretName" . }}
                  key: OSMU_ACCESS_KEY_SECRET_ENCRYPTION_KEY
{{- if or .Values.backend.mcTools.enabled .Values.backend.operationsReports.enabled }}
          volumeMounts:
{{- if .Values.backend.mcTools.enabled }}
            - name: mc-tools
              mountPath: {{ .Values.backend.mcTools.mountPath | quote }}
              readOnly: true
{{- end }}
{{- if .Values.backend.operationsReports.enabled }}
            - name: operations-reports
              mountPath: {{ .Values.backend.operationsReports.mountPath | quote }}
              readOnly: true
{{- end }}
{{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
{{- if or .Values.backend.mcTools.enabled .Values.backend.operationsReports.enabled }}
      volumes:
{{- if .Values.backend.mcTools.enabled }}
        - name: mc-tools
          emptyDir: {}
{{- end }}
{{- if .Values.backend.operationsReports.enabled }}
        - name: operations-reports
{{- if eq .Values.backend.operationsReports.type "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ .Values.backend.operationsReports.claimName | quote }}
{{- else }}
          configMap:
            name: {{ .Values.backend.operationsReports.configMapName | quote }}
            optional: {{ .Values.backend.operationsReports.optional }}
{{- end }}
{{- end }}
{{- end }}
