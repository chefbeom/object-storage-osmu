{{- if .Values.monitoring.operator.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "osmu.fullname" . }}-backend
  namespace: {{ include "osmu.namespace" . }}
  labels:
    app.kubernetes.io/name: osmu-backend
    {{- include "osmu.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.operator.releaseLabel | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: osmu-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  namespaceSelector:
    matchNames:
      - {{ include "osmu.namespace" . }}
  endpoints:
    - port: http
      path: {{ .Values.backend.metrics.path | quote }}
      interval: {{ .Values.monitoring.operator.interval | quote }}
      scrapeTimeout: {{ .Values.monitoring.operator.scrapeTimeout | quote }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "osmu.fullname" . }}-backend
  namespace: {{ include "osmu.namespace" . }}
  labels:
    app.kubernetes.io/name: osmu-backend
    {{- include "osmu.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.operator.releaseLabel | quote }}
spec:
  groups:
    - name: osmu.prototype.availability
      rules:
        - alert: OsmuBackendDown
          expr: up{job=~"osmu-backend.*"} == 0
          for: 2m
          labels:
            severity: critical
            service: osmu-backend
          annotations:
            summary: OSMU backend scrape target is down.
            description: Prometheus cannot scrape the OSMU backend for more than 2 minutes.
        - alert: OsmuBackendHighErrorRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{job=~"osmu-backend.*",status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{job=~"osmu-backend.*"}[5m])), 1)
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            service: osmu-backend
          annotations:
            summary: OSMU backend 5xx error rate is high.
            description: Backend 5xx ratio is above 5 percent for 5 minutes.
        - alert: OsmuBackendHighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(http_server_requests_seconds_bucket{job=~"osmu-backend.*"}[5m])) by (le)
            ) > 2
          for: 10m
          labels:
            severity: warning
            service: osmu-backend
          annotations:
            summary: OSMU backend p95 latency is high.
            description: Backend p95 latency is above 2 seconds for 10 minutes.
    - name: osmu.prototype.operations
      rules:
        - alert: OsmuBackupRestoreDrillPending
          expr: vector(1)
          for: 0m
          labels:
            severity: info
            service: osmu-operations
          annotations:
            summary: OSMU backup restore drill must be executed before durable pilot.
            description: This draft alert is a handoff reminder. Disable it only after a restore drill is executed and recorded for the target environment.
        - alert: OsmuBackupCronJobFailed
          expr: kube_job_status_failed{namespace=~"osmu.*",job_name=~"osmu-(mariadb|minio)-backup.*"} > 0
          for: 5m
          labels:
            severity: warning
            service: osmu-backup
          annotations:
            summary: OSMU backup CronJob failed.
            description: A MariaDB or MinIO backup Job has failed in the target namespace. Inspect the Job logs and backup PVC.
        - alert: OsmuBackupCronJobStale
          expr: |
            (
              time()
              -
              max by (namespace, cronjob) (
                kube_cronjob_status_last_successful_time{namespace=~"osmu.*",cronjob=~"osmu-(mariadb|minio)-backup"}
              )
            ) > 93600
          for: 15m
          labels:
            severity: warning
            service: osmu-backup
          annotations:
            summary: OSMU backup CronJob has no recent successful run.
            description: A MariaDB or MinIO backup CronJob has not reported a successful run within 26 hours. Verify kube-state-metrics, CronJob status, and backup artifacts.
{{- end }}
