apiVersion: v1
kind: Service
metadata:
  name: osmu-mariadb
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-mariadb
    app.kubernetes.io/part-of: osmu
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    app.kubernetes.io/name: osmu-mariadb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: osmu-mariadb
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-mariadb
    app.kubernetes.io/part-of: osmu
spec:
  serviceName: osmu-mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: osmu-mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osmu-mariadb
        app.kubernetes.io/part-of: osmu
    spec:
      serviceAccountName: osmu-mariadb
      automountServiceAccountToken: false
      containers:
        - name: mariadb
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: osmu-config
                  key: MARIADB_DATABASE
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: MARIADB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: MARIADB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: MARIADB_ROOT_PASSWORD
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
