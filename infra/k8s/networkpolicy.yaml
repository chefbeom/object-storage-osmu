apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osmu-backup-egress
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-backup
    app.kubernetes.io/part-of: osmu
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: osmu-backup
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: osmu-mariadb
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: osmu-minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
