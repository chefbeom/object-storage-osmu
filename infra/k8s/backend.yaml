apiVersion: v1
kind: Service
metadata:
  name: osmu-backend
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-backend
    app.kubernetes.io/part-of: osmu
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /actuator/prometheus
    prometheus.io/port: "8080"
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: osmu-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osmu-backend
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-backend
    app.kubernetes.io/part-of: osmu
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: osmu-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osmu-backend
        app.kubernetes.io/part-of: osmu
    spec:
      serviceAccountName: osmu-backend
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: osmu-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: osmu-backend:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: osmu-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mariadb://osmu-mariadb:3306/$(MARIADB_DATABASE)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: MARIADB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: MARIADB_PASSWORD
            - name: OSMU_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: MINIO_ROOT_USER
            - name: OSMU_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: MINIO_ROOT_PASSWORD
            - name: OSMU_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: OSMU_ADMIN_PASSWORD
            - name: OSMU_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: OSMU_JWT_SECRET
            - name: OSMU_ACCESS_KEY_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: OSMU_ACCESS_KEY_SECRET_ENCRYPTION_KEY
          volumeMounts:
            - name: operations-reports
              mountPath: /app/.osmu-run
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: operations-reports
          configMap:
            name: osmu-operations-reports
            optional: true
