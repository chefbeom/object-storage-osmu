apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: osmu-backend
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-backend
    app.kubernetes.io/part-of: osmu
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: osmu-backend
      app.kubernetes.io/part-of: osmu
  namespaceSelector:
    matchNames:
      - osmu
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: osmu-backend
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-backend
    app.kubernetes.io/part-of: osmu
spec:
  groups:
    - name: osmu.prototype.availability
      rules:
        - alert: OsmuBackendDown
          expr: up{job=~"osmu-backend.*"} == 0
          for: 2m
          labels:
            severity: critical
            service: osmu-backend
          annotations:
            summary: OSMU backend scrape target is down.
            description: Prometheus cannot scrape the OSMU backend for more than 2 minutes.
        - alert: OsmuBackendHighErrorRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{job=~"osmu-backend.*",status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(http_server_requests_seconds_count{job=~"osmu-backend.*"}[5m])), 1)
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            service: osmu-backend
          annotations:
            summary: OSMU backend 5xx error rate is high.
            description: Backend 5xx ratio is above 5 percent for 5 minutes.
        - alert: OsmuBackendHighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(http_server_requests_seconds_bucket{job=~"osmu-backend.*"}[5m])) by (le)
            ) > 2
          for: 10m
          labels:
            severity: warning
            service: osmu-backend
          annotations:
            summary: OSMU backend p95 latency is high.
            description: Backend p95 latency is above 2 seconds for 10 minutes.
    - name: osmu.prototype.operations
      rules:
        - alert: OsmuBackupRestoreDrillPending
          expr: vector(1)
          for: 0m
          labels:
            severity: info
            service: osmu-operations
          annotations:
            summary: OSMU backup restore drill must be executed before durable pilot.
            description: This draft alert is a handoff reminder. Disable it only after a restore drill is executed and recorded for the target environment.
        - alert: OsmuDataFlowFailureSpike
          expr: sum(increase(osmu_data_flow_operations_total{job=~"osmu-backend.*",status="failure"}[15m])) > 5
          for: 5m
          labels:
            severity: warning
            service: osmu-data-flow
          annotations:
            summary: OSMU data-flow failure spike detected.
            description: More than 5 failed upload/download/list/delete operations were recorded in the last 15 minutes.
        - alert: OsmuDataFlowCancelSpike
          expr: sum(increase(osmu_data_flow_operations_total{job=~"osmu-backend.*",status="cancelled"}[15m])) > 10
          for: 5m
          labels:
            severity: warning
            service: osmu-data-flow
          annotations:
            summary: OSMU data-flow cancel spike detected.
            description: More than 10 cancelled transfer operations were recorded in the last 15 minutes.
        - alert: OsmuDataFlowAbnormalEgress
          expr: sum(rate(osmu_data_flow_bytes_total{job=~"osmu-backend.*",direction="egress"}[15m])) > 10485760
          for: 10m
          labels:
            severity: warning
            service: osmu-data-flow
          annotations:
            summary: OSMU data-flow egress rate is above the pilot threshold.
            description: Total egress is above 10 MiB/s for 10 minutes. Tune this threshold for the target tenant and workload.
        - alert: OsmuDataFlowBucketTrafficAnomaly
          expr: max by (bucket) (rate(osmu_data_flow_bytes_total{job=~"osmu-backend.*",direction=~"ingress|egress"}[15m])) > 5242880
          for: 10m
          labels:
            severity: warning
            service: osmu-data-flow
          annotations:
            summary: OSMU bucket-level data-flow rate is above the pilot threshold.
            description: Bucket {{ $labels.bucket }} is above 5 MiB/s for 10 minutes. Tune this threshold or replace it with a tenant baseline before production.
        - alert: OsmuBackupCronJobFailed
          expr: kube_job_status_failed{namespace=~"osmu.*",job_name=~"osmu-(mariadb|minio)-backup.*"} > 0
          for: 5m
          labels:
            severity: warning
            service: osmu-backup
          annotations:
            summary: OSMU backup CronJob failed.
            description: A MariaDB or MinIO backup Job has failed in the target namespace. Inspect the Job logs and backup PVC.
        - alert: OsmuBackupCronJobStale
          expr: |
            (
              time()
              -
              max by (namespace, cronjob) (
                kube_cronjob_status_last_successful_time{namespace=~"osmu.*",cronjob=~"osmu-(mariadb|minio)-backup"}
              )
            ) > 93600
          for: 15m
          labels:
            severity: warning
            service: osmu-backup
          annotations:
            summary: OSMU backup CronJob has no recent successful run.
            description: A MariaDB or MinIO backup CronJob has not reported a successful run within 26 hours. Verify kube-state-metrics, CronJob status, and backup artifacts.
