apiVersion: v1
kind: ServiceAccount
metadata:
  name: osmu-backup
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-backup
    app.kubernetes.io/part-of: osmu
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: osmu-backup-data
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-backup
    app.kubernetes.io/part-of: osmu
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: osmu-mariadb-backup
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-backup
    app.kubernetes.io/component: mariadb-backup
    app.kubernetes.io/part-of: osmu
spec:
  schedule: "0 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: osmu-backup
            app.kubernetes.io/component: mariadb-backup
            app.kubernetes.io/part-of: osmu
        spec:
          restartPolicy: OnFailure
          serviceAccountName: osmu-backup
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mariadb-backup
              image: mariadb:11.4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  target="/backup/mariadb/${timestamp}"
                  mkdir -p "$target"
                  mariadb-dump --single-transaction --routines --triggers \
                    -hosmu-mariadb \
                    -u"$MARIADB_USER" \
                    --password="$MARIADB_PASSWORD" \
                    "$MARIADB_DATABASE" > "$target/metadata.sql"
                  sha256sum "$target/metadata.sql" > "$target/metadata.sql.sha256"
                  find /backup/mariadb -mindepth 1 -maxdepth 1 -type d -mtime +"${OSMU_BACKUP_RETENTION_DAYS}" -exec rm -rf {} +
              env:
                - name: MARIADB_DATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: osmu-config
                      key: MARIADB_DATABASE
                - name: MARIADB_USER
                  valueFrom:
                    secretKeyRef:
                      name: osmu-secret
                      key: MARIADB_USER
                - name: MARIADB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: osmu-secret
                      key: MARIADB_PASSWORD
                - name: OSMU_BACKUP_RETENTION_DAYS
                  value: "7"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
          volumes:
            - name: backup-data
              persistentVolumeClaim:
                claimName: osmu-backup-data
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: osmu-minio-backup
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-backup
    app.kubernetes.io/component: minio-backup
    app.kubernetes.io/part-of: osmu
spec:
  schedule: "30 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: osmu-backup
            app.kubernetes.io/component: minio-backup
            app.kubernetes.io/part-of: osmu
        spec:
          restartPolicy: OnFailure
          serviceAccountName: osmu-backup
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: minio-backup
              image: minio/mc:RELEASE.2025-05-21T01-59-54Z
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  target="/backup/minio/${timestamp}"
                  mkdir -p "$target"
                  mc alias set osmu http://osmu-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
                  mc mirror --overwrite osmu "$target"
                  find /backup/minio -mindepth 1 -maxdepth 1 -type d -mtime +"${OSMU_BACKUP_RETENTION_DAYS}" -exec rm -rf {} +
              env:
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: osmu-secret
                      key: MINIO_ROOT_USER
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: osmu-secret
                      key: MINIO_ROOT_PASSWORD
                - name: OSMU_BACKUP_RETENTION_DAYS
                  value: "7"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup-data
                  mountPath: /backup
          volumes:
            - name: backup-data
              persistentVolumeClaim:
                claimName: osmu-backup-data
