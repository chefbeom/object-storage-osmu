apiVersion: v1
kind: Secret
metadata:
  name: osmu-secret
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu
    app.kubernetes.io/part-of: osmu
type: Opaque
stringData:
  MARIADB_USER: change-me-osmu-user
  MARIADB_PASSWORD: change-me-osmu-password
  MARIADB_ROOT_PASSWORD: change-me-root-password
  MINIO_ROOT_USER: change-me-minio-user
  MINIO_ROOT_PASSWORD: change-me-minio-password
  OSMU_ADMIN_PASSWORD: change-me-admin-password
  OSMU_JWT_SECRET: change-me-at-least-32-characters-jwt-secret
  OSMU_ACCESS_KEY_SECRET_ENCRYPTION_KEY: change-me-at-least-32-characters-access-key-secret
