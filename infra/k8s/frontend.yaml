apiVersion: v1
kind: Service
metadata:
  name: osmu-frontend
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-frontend
    app.kubernetes.io/part-of: osmu
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: osmu-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osmu-frontend
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-frontend
    app.kubernetes.io/part-of: osmu
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: osmu-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osmu-frontend
        app.kubernetes.io/part-of: osmu
    spec:
      serviceAccountName: osmu-frontend
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: osmu-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: osmu-frontend:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
