apiVersion: batch/v1
kind: Job
metadata:
  name: osmu-restore-from-backup-example
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-backup
    app.kubernetes.io/component: restore-drill
    app.kubernetes.io/part-of: osmu
  annotations:
    osmu.io/warning: "Example only. Restoring can overwrite MariaDB metadata and MinIO objects."
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osmu-backup
        app.kubernetes.io/component: restore-drill
        app.kubernetes.io/part-of: osmu
    spec:
      restartPolicy: Never
      serviceAccountName: osmu-backup
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: restore-mariadb
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              test "$BACKUP_TIMESTAMP" != "YYYYMMDDTHHMMSSZ"
              test -f "/backup/mariadb/${BACKUP_TIMESTAMP}/metadata.sql"
              mariadb -hosmu-mariadb -u"$MARIADB_USER" --password="$MARIADB_PASSWORD" "$MARIADB_DATABASE" \
                < "/backup/mariadb/${BACKUP_TIMESTAMP}/metadata.sql"
          env:
            - name: BACKUP_TIMESTAMP
              value: "YYYYMMDDTHHMMSSZ"
            - name: MARIADB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: osmu-config
                  key: MARIADB_DATABASE
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: MARIADB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: MARIADB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: backup-data
              mountPath: /backup
      containers:
        - name: restore-minio
          image: minio/mc:RELEASE.2025-05-21T01-59-54Z
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              test "$BACKUP_TIMESTAMP" != "YYYYMMDDTHHMMSSZ"
              test -d "/backup/minio/${BACKUP_TIMESTAMP}"
              mc alias set osmu http://osmu-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
              mc mirror --overwrite "/backup/minio/${BACKUP_TIMESTAMP}" osmu
          env:
            - name: BACKUP_TIMESTAMP
              value: "YYYYMMDDTHHMMSSZ"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: MINIO_ROOT_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: backup-data
              mountPath: /backup
      volumes:
        - name: backup-data
          persistentVolumeClaim:
            claimName: osmu-backup-data
