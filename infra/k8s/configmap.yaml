apiVersion: v1
kind: ConfigMap
metadata:
  name: osmu-config
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu
    app.kubernetes.io/part-of: osmu
data:
  MARIADB_DATABASE: osmu
  SPRING_PROFILES_ACTIVE: local
  SERVER_PORT: "8080"
  OSMU_FLYWAY_ENABLED: "true"
  OSMU_ADMIN_LOGIN_ID: admin
  OSMU_ADMIN_EMAIL: admin@example.com
  OSMU_ADMIN_NAME: Admin
  OSMU_JWT_ACCESS_TOKEN_TTL_SECONDS: "3600"
  OSMU_JWT_REFRESH_TOKEN_TTL_SECONDS: "604800"
  OSMU_METADATA_MODE: mariadb
  OSMU_STORAGE_MODE: minio
  OSMU_STORAGE_ENDPOINT: http://osmu-minio:9000
  OSMU_API_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  OSMU_STORAGE_CORS_ENABLED: "true"
  OSMU_STORAGE_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  OSMU_UPLOAD_CLEANUP_ENABLED: "true"
  OSMU_UPLOAD_CLEANUP_INITIAL_DELAY_MS: "60000"
  OSMU_UPLOAD_CLEANUP_FIXED_DELAY_MS: "300000"
  OSMU_UPLOAD_CLEANUP_BATCH_SIZE: "100"
  OSMU_OBJECT_RETENTION_ENABLED: "true"
  OSMU_OBJECT_RETENTION_DAYS: "30"
  OSMU_OBJECT_RETENTION_INITIAL_DELAY_MS: "120000"
  OSMU_OBJECT_RETENTION_FIXED_DELAY_MS: "3600000"
  OSMU_OBJECT_RETENTION_BATCH_SIZE: "100"
  OSMU_ACCESS_KEY_PROVISIONING_MODE: minio
  OSMU_ACCESS_KEY_MC_PATH: /opt/osmu-tools/mc
  OSMU_ACCESS_KEY_MINIO_ALIAS: osmu-minio
  OSMU_S3_PUBLIC_ENDPOINT: https://osmu.local/api/s3
  OSMU_S3_REGION: us-east-1
  OSMU_S3_SIGV4_CLOCK_SKEW_SECONDS: "900"
  OSMU_S3_VIRTUAL_HOSTED_STYLE_ENABLED: "true"
  OSMU_S3_VIRTUAL_HOSTED_STYLE_DOMAIN_SUFFIXES: localhost
  OSMU_OPERATIONS_READINESS_CONVERGENCE_REPORT_PATH: .osmu-run/latest-operations-readiness-convergence.json
  OSMU_OPERATIONS_READINESS_KUBERNETES_REPORT_SYNC_REPORT_PATH: .osmu-run/latest-kubernetes-operations-report-sync.json
  OSMU_OPERATIONS_READINESS_DATA_FLOW_STORAGE_PLAN_REPORT_PATH: .osmu-run/latest-data-flow-storage-plan.json
  OSMU_OPERATIONS_READINESS_DATA_FLOW_QUERY_RETENTION_BUDGET_REPORT_PATH: .osmu-run/latest-data-flow-query-retention-budget-evidence.json
  OSMU_OPERATIONS_READINESS_DATA_FLOW_STORAGE_TRANSITION_RUNBOOK_REPORT_PATH: .osmu-run/latest-data-flow-storage-transition-runbook-evidence.json