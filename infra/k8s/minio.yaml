apiVersion: v1
kind: Service
metadata:
  name: osmu-minio
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-minio
    app.kubernetes.io/part-of: osmu
spec:
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
  selector:
    app.kubernetes.io/name: osmu-minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: osmu-minio
  namespace: osmu
  labels:
    app.kubernetes.io/name: osmu-minio
    app.kubernetes.io/part-of: osmu
spec:
  serviceName: osmu-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: osmu-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osmu-minio
        app.kubernetes.io/part-of: osmu
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-05-24T17-08-30Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - :9001
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: osmu-secret
                  key: MINIO_ROOT_PASSWORD
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: minio-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
