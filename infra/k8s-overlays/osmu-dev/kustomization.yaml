apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: osmu-dev
resources:
  - ../../k8s
  - pv.yaml
  - frontend-nginx-config.yaml
patches:
  - target:
      kind: Namespace
      name: osmu
    patch: |-
      - op: replace
        path: /metadata/name
        value: osmu-dev
  - target:
      kind: ConfigMap
      name: osmu-config
    patch: |-
      - op: replace
        path: /data/OSMU_API_CORS_ALLOWED_ORIGINS
        value: http://osmu-dev.192.168.35.60.nip.io:30080,http://osmu-dev.192.168.35.60.nip.io,http://192.168.35.60:30080,http://192.168.35.60
      - op: replace
        path: /data/OSMU_STORAGE_CORS_ALLOWED_ORIGINS
        value: http://osmu-dev.192.168.35.60.nip.io:30080,http://osmu-dev.192.168.35.60.nip.io,http://192.168.35.60:30080,http://192.168.35.60
      - op: replace
        path: /data/OSMU_STORAGE_CORS_ENABLED
        value: "true"
      - op: replace
        path: /data/OSMU_ACCESS_KEY_PROVISIONING_MODE
        value: minio
      - op: replace
        path: /data/OSMU_S3_VIRTUAL_HOSTED_STYLE_DOMAIN_SUFFIXES
        value: osmu-dev.192.168.35.60.nip.io,192.168.35.60
  - target:
      kind: StatefulSet
      name: osmu-mariadb
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: osmu-dev-local
  - target:
      kind: StatefulSet
      name: osmu-minio
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: osmu-dev-local
  - target:
      kind: Deployment
      name: osmu-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: eclipse-temurin:17-jre-jammy
      - op: add
        path: /spec/template/spec/containers/0/command
        value:
          - java
          - -jar
          - /app/app.jar
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HOME
          value: /tmp
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MC_CONFIG_DIR
          value: /tmp/.mc
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: backend-artifact
            mountPath: /app
            readOnly: true
          - name: backend-mc
            mountPath: /usr/local/bin/mc
            subPath: mc
            readOnly: true
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: slave01
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: backend-artifact
            hostPath:
              path: /var/lib/osmu-dev/backend
              type: Directory
          - name: backend-mc
            hostPath:
              path: /var/lib/osmu-dev/backend/bin
              type: Directory
  - target:
      kind: Deployment
      name: osmu-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: nginx:1.27-alpine
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: frontend-static
            mountPath: /usr/share/nginx/html
            readOnly: true
          - name: frontend-nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
          - name: frontend-nginx-temp
            mountPath: /tmp/nginx
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: slave01
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: frontend-static
            hostPath:
              path: /var/lib/osmu-dev/frontend/dist
              type: Directory
          - name: frontend-nginx-config
            configMap:
              name: osmu-frontend-nginx
          - name: frontend-nginx-temp
            emptyDir: {}
  - target:
      kind: Ingress
      name: osmu
    patch: |-
      - op: add
        path: /spec/ingressClassName
        value: nginx
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
        value: "false"
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1force-ssl-redirect
        value: "false"
      - op: remove
        path: /spec/tls
      - op: replace
        path: /spec/rules/0/host
        value: osmu-dev.192.168.35.60.nip.io
