services:
  mariadb:
    image: mariadb:11.4
    container_name: osmu-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-osmu}
      MARIADB_USER: ${MARIADB_USER:-osmu}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-osmu-password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root-password}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - osmu_mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    container_name: osmu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - osmu_minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  create-minio-buckets:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    container_name: osmu-minio-init
    volumes:
      - ./minio-cors.json:/etc/osmu/minio-cors.json:ro
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      for bucket in $$(echo ${MINIO_DEFAULT_BUCKETS:-osmu-default} | tr ',' ' '); do
        mc mb --ignore-existing local/$$bucket;
        mc cors set local/$$bucket /etc/osmu/minio-cors.json;
      done;
      "
    restart: "no"

  backend:
    build:
      context: ../../osmu-backend
      dockerfile: Dockerfile
    container_name: osmu-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE:-osmu}
      SPRING_DATASOURCE_USERNAME: ${MARIADB_USER:-osmu}
      SPRING_DATASOURCE_PASSWORD: ${MARIADB_PASSWORD:-osmu-password}
      OSMU_FLYWAY_ENABLED: ${OSMU_FLYWAY_ENABLED:-true}
      OSMU_ADMIN_LOGIN_ID: ${OSMU_ADMIN_LOGIN_ID:-admin}
      OSMU_ADMIN_PASSWORD: ${OSMU_ADMIN_PASSWORD:-password}
      OSMU_ADMIN_EMAIL: ${OSMU_ADMIN_EMAIL:-admin@example.com}
      OSMU_ADMIN_NAME: ${OSMU_ADMIN_NAME:-Admin}
      OSMU_JWT_SECRET: ${OSMU_JWT_SECRET:-local-dev-jwt-secret-change-me-32-chars}
      OSMU_JWT_ACCESS_TOKEN_TTL_SECONDS: ${OSMU_JWT_ACCESS_TOKEN_TTL_SECONDS:-3600}
      OSMU_JWT_REFRESH_TOKEN_TTL_SECONDS: ${OSMU_JWT_REFRESH_TOKEN_TTL_SECONDS:-604800}
      OSMU_METADATA_MODE: mariadb
      OSMU_STORAGE_MODE: minio
      OSMU_STORAGE_ENDPOINT: http://minio:9000
      OSMU_STORAGE_PRESIGNED_ENDPOINT: ${OSMU_STORAGE_PRESIGNED_ENDPOINT:-http://localhost:9000}
      OSMU_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      OSMU_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OSMU_STORAGE_CORS_ENABLED: ${OSMU_STORAGE_CORS_ENABLED:-true}
      OSMU_STORAGE_CORS_ALLOWED_ORIGINS: ${OSMU_STORAGE_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      OSMU_UPLOAD_CLEANUP_ENABLED: ${OSMU_UPLOAD_CLEANUP_ENABLED:-true}
      OSMU_UPLOAD_CLEANUP_INITIAL_DELAY_MS: ${OSMU_UPLOAD_CLEANUP_INITIAL_DELAY_MS:-60000}
      OSMU_UPLOAD_CLEANUP_FIXED_DELAY_MS: ${OSMU_UPLOAD_CLEANUP_FIXED_DELAY_MS:-300000}
      OSMU_UPLOAD_CLEANUP_BATCH_SIZE: ${OSMU_UPLOAD_CLEANUP_BATCH_SIZE:-100}
      OSMU_OBJECT_RETENTION_ENABLED: ${OSMU_OBJECT_RETENTION_ENABLED:-true}
      OSMU_OBJECT_RETENTION_DAYS: ${OSMU_OBJECT_RETENTION_DAYS:-30}
      OSMU_OBJECT_RETENTION_INITIAL_DELAY_MS: ${OSMU_OBJECT_RETENTION_INITIAL_DELAY_MS:-120000}
      OSMU_OBJECT_RETENTION_FIXED_DELAY_MS: ${OSMU_OBJECT_RETENTION_FIXED_DELAY_MS:-3600000}
      OSMU_OBJECT_RETENTION_BATCH_SIZE: ${OSMU_OBJECT_RETENTION_BATCH_SIZE:-100}
      OSMU_ACCESS_KEY_PROVISIONING_MODE: ${OSMU_ACCESS_KEY_PROVISIONING_MODE:-minio}
      OSMU_ACCESS_KEY_SECRET_ENCRYPTION_KEY: ${OSMU_ACCESS_KEY_SECRET_ENCRYPTION_KEY:-local-dev-access-key-secret-encryption-key-change-me}
      OSMU_ACCESS_KEY_MC_PATH: ${OSMU_ACCESS_KEY_MC_PATH:-mc}
      OSMU_ACCESS_KEY_MINIO_ALIAS: ${OSMU_ACCESS_KEY_MINIO_ALIAS:-osmu-minio}
      OSMU_S3_PUBLIC_ENDPOINT: ${OSMU_S3_PUBLIC_ENDPOINT:-http://localhost:8080}
      OSMU_S3_SIGV4_CLOCK_SKEW_SECONDS: ${OSMU_S3_SIGV4_CLOCK_SKEW_SECONDS:-900}
      OSMU_S3_VIRTUAL_HOSTED_STYLE_ENABLED: ${OSMU_S3_VIRTUAL_HOSTED_STYLE_ENABLED:-true}
      OSMU_S3_VIRTUAL_HOSTED_STYLE_DOMAIN_SUFFIXES: ${OSMU_S3_VIRTUAL_HOSTED_STYLE_DOMAIN_SUFFIXES:-localhost}
      OSMU_OPERATIONS_READINESS_CONVERGENCE_REPORT_PATH: ${OSMU_OPERATIONS_READINESS_CONVERGENCE_REPORT_PATH:-.osmu-run/latest-operations-readiness-convergence.json}
      OSMU_OPERATIONS_READINESS_KUBERNETES_REPORT_SYNC_REPORT_PATH: ${OSMU_OPERATIONS_READINESS_KUBERNETES_REPORT_SYNC_REPORT_PATH:-.osmu-run/latest-kubernetes-operations-report-sync.json}
      OSMU_OPERATIONS_READINESS_DATA_FLOW_STORAGE_PLAN_REPORT_PATH: ${OSMU_OPERATIONS_READINESS_DATA_FLOW_STORAGE_PLAN_REPORT_PATH:-.osmu-run/latest-data-flow-storage-plan.json}
      OSMU_OPERATIONS_READINESS_DATA_FLOW_QUERY_RETENTION_BUDGET_REPORT_PATH: ${OSMU_OPERATIONS_READINESS_DATA_FLOW_QUERY_RETENTION_BUDGET_REPORT_PATH:-.osmu-run/latest-data-flow-query-retention-budget-evidence.json}
      OSMU_OPERATIONS_READINESS_DATA_FLOW_STORAGE_TRANSITION_RUNBOOK_REPORT_PATH: ${OSMU_OPERATIONS_READINESS_DATA_FLOW_STORAGE_TRANSITION_RUNBOOK_REPORT_PATH:-.osmu-run/latest-data-flow-storage-transition-runbook-evidence.json}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ../../.osmu-run:/app/.osmu-run:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/api/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ../../osmu-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_MULTIPART_UPLOAD_THRESHOLD_BYTES: ${VITE_MULTIPART_UPLOAD_THRESHOLD_BYTES:-134217728}
        VITE_MULTIPART_UPLOAD_PART_SIZE_BYTES: ${VITE_MULTIPART_UPLOAD_PART_SIZE_BYTES:-67108864}
        VITE_MULTIPART_UPLOAD_CONCURRENCY: ${VITE_MULTIPART_UPLOAD_CONCURRENCY:-4}
        VITE_MULTIPART_UPLOAD_PART_RETRIES: ${VITE_MULTIPART_UPLOAD_PART_RETRIES:-2}
        VITE_MULTIPART_UPLOAD_RETRY_BASE_DELAY_MS: ${VITE_MULTIPART_UPLOAD_RETRY_BASE_DELAY_MS:-500}
        VITE_MULTIPART_UPLOAD_RETRY_JITTER_RATIO: ${VITE_MULTIPART_UPLOAD_RETRY_JITTER_RATIO:-0.25}
    container_name: osmu-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:8080"

volumes:
  osmu_mariadb_data:
  osmu_minio_data: