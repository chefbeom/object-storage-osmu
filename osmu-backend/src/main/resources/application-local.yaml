spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/osmu}
    username: ${SPRING_DATASOURCE_USERNAME:osmu}
    password: ${SPRING_DATASOURCE_PASSWORD:osmu-password}
  flyway:
    enabled: ${OSMU_FLYWAY_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}

osmu:
  bootstrap:
    admin:
      enabled: ${OSMU_BOOTSTRAP_ADMIN_ENABLED:true}
      allow-default-credentials: ${OSMU_BOOTSTRAP_ADMIN_ALLOW_DEFAULT_CREDENTIALS:true}
      login-id: ${OSMU_ADMIN_LOGIN_ID:admin}
      password: ${OSMU_ADMIN_PASSWORD:password}
      email: ${OSMU_ADMIN_EMAIL:admin@example.com}
      name: ${OSMU_ADMIN_NAME:Admin}
  auth:
    jwt:
      secret: ${OSMU_JWT_SECRET:local-dev-jwt-secret-change-me-32-chars}
  access-key:
    secret-encryption-key: ${OSMU_ACCESS_KEY_SECRET_ENCRYPTION_KEY:local-dev-access-key-secret-encryption-key-change-me}
  api:
    cors:
      allowed-origins: ${OSMU_API_CORS_ALLOWED_ORIGINS:${OSMU_STORAGE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}}
  storage:
    mode: ${OSMU_STORAGE_MODE:minio}
    endpoint: ${OSMU_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${OSMU_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${OSMU_STORAGE_SECRET_KEY:minioadmin}
    cors:
      enabled: ${OSMU_STORAGE_CORS_ENABLED:true}
      allowed-origins: ${OSMU_STORAGE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  metadata:
    mode: ${OSMU_METADATA_MODE:mariadb}
