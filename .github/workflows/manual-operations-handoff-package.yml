name: Manual Operations Handoff Package

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Target environment label
        required: true
        default: prod
      target_cluster:
        description: Target cluster label
        required: true
        default: osmu-prod
      operator:
        description: Operator or team recording the handoff
        required: true
        default: ""
      handoff_started_at:
        description: Handoff start time in ISO-8601 format
        required: true
        default: ""
      handoff_completed_at:
        description: Handoff completion time in ISO-8601 format
        required: true
        default: ""
      change_approval_ref:
        description: External change approval reference
        required: true
        default: ""
      deployment_evidence_ref:
        description: External deployment evidence reference
        required: true
        default: ""
      operations_readiness_ref:
        description: External operations readiness evidence reference
        required: true
        default: ""
      operations_convergence_ref:
        description: External operations convergence evidence reference
        required: true
        default: ""
      data_flow_storage_plan_evidence_ref:
        description: External data-flow storage transition evidence reference
        required: true
        default: ""
      operations_readiness_json_base64:
        description: Optional base64 latest operations readiness JSON snapshot
        required: false
        default: ""
      operations_convergence_json_base64:
        description: Optional base64 latest operations readiness convergence JSON snapshot
        required: false
        default: ""
      data_flow_storage_plan_json_base64:
        description: Optional base64 latest data-flow storage plan JSON snapshot
        required: false
        default: ""
      secret_rotation_evidence_ref:
        description: External secret rotation evidence reference
        required: true
        default: ""
      commercial_integration_evidence_ref:
        description: External commercial integration evidence reference
        required: true
        default: ""
      commercial_approval_evidence_ref:
        description: External commercial approval evidence reference
        required: true
        default: ""
      commercial_integration_json_base64:
        description: Optional base64 latest commercial integration evidence JSON snapshot
        required: false
        default: ""
      commercial_approval_json_base64:
        description: Optional base64 latest commercial approval evidence JSON snapshot
        required: false
        default: ""
      enterprise_auth_evidence_ref:
        description: External enterprise auth evidence reference
        required: true
        default: ""
      enterprise_auth_json_base64:
        description: Optional base64 latest enterprise auth smoke JSON snapshot
        required: false
        default: ""
      backup_restore_evidence_ref:
        description: External backup or restore evidence reference
        required: true
        default: ""
      ha_dr_evidence_ref:
        description: External HA/DR evidence reference
        required: true
        default: ""
      monitoring_evidence_ref:
        description: External monitoring evidence reference
        required: true
        default: ""
      security_evidence_ref:
        description: External security evidence reference
        required: true
        default: ""
      iam_rbac_evidence_ref:
        description: External IAM/RBAC evidence reference
        required: true
        default: ""
      runbook_review_ref:
        description: External runbook review reference
        required: true
        default: ""
      troubleshooting_review_ref:
        description: External troubleshooting review reference
        required: true
        default: ""
      support_escalation_ref:
        description: External support escalation review reference
        required: true
        default: ""
      support_sla_ref:
        description: External support SLA reference
        required: true
        default: ""
      known_gaps_ref:
        description: External accepted known gaps reference
        required: true
        default: ""
      confirm_runbook_reviewed:
        description: Confirm runbook review
        required: true
        type: boolean
        default: false
      confirm_troubleshooting_reviewed:
        description: Confirm troubleshooting review
        required: true
        type: boolean
        default: false
      confirm_rollback_reviewed:
        description: Confirm rollback path review
        required: true
        type: boolean
        default: false
      confirm_support_escalation_reviewed:
        description: Confirm support escalation review
        required: true
        type: boolean
        default: false
      confirm_known_gaps_accepted:
        description: Confirm known gaps acceptance
        required: true
        type: boolean
        default: false
      confirm_operations_readiness_snapshot_reviewed:
        description: Confirm operations readiness snapshot review
        required: true
        type: boolean
        default: false
      confirm_operations_convergence_snapshot_reviewed:
        description: Confirm operations convergence snapshot review
        required: true
        type: boolean
        default: false
      confirm_data_flow_storage_plan_reviewed:
        description: Confirm data-flow storage plan snapshot review
        required: true
        type: boolean
        default: false
      confirm_no_secret_values:
        description: Confirm inputs contain references only, not secret values
        required: true
        type: boolean
        default: false
      require_production_evidence:
        description: Require all production evidence references
        required: true
        type: boolean
        default: true
      require_operations_snapshot_evidence:
        description: Require readiness and convergence JSON snapshots
        required: true
        type: boolean
        default: true
      fail_if_not_passed:
        description: Fail workflow when package result is not passed
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: manual-operations-handoff-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  operations-handoff-package:
    name: Manual operations handoff package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record operations handoff package
        shell: pwsh
        env:
          OSMU_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          OSMU_TARGET_CLUSTER: ${{ inputs.target_cluster }}
          OSMU_OPERATOR: ${{ inputs.operator }}
          OSMU_HANDOFF_STARTED_AT: ${{ inputs.handoff_started_at }}
          OSMU_HANDOFF_COMPLETED_AT: ${{ inputs.handoff_completed_at }}
          OSMU_CHANGE_APPROVAL_REF: ${{ inputs.change_approval_ref }}
          OSMU_DEPLOYMENT_EVIDENCE_REF: ${{ inputs.deployment_evidence_ref }}
          OSMU_OPERATIONS_READINESS_REF: ${{ inputs.operations_readiness_ref }}
          OSMU_OPERATIONS_CONVERGENCE_REF: ${{ inputs.operations_convergence_ref }}
          OSMU_DATA_FLOW_STORAGE_PLAN_EVIDENCE_REF: ${{ inputs.data_flow_storage_plan_evidence_ref }}
          OSMU_OPERATIONS_READINESS_JSON_BASE64: ${{ inputs.operations_readiness_json_base64 }}
          OSMU_OPERATIONS_CONVERGENCE_JSON_BASE64: ${{ inputs.operations_convergence_json_base64 }}
          OSMU_DATA_FLOW_STORAGE_PLAN_JSON_BASE64: ${{ inputs.data_flow_storage_plan_json_base64 }}
          OSMU_SECRET_ROTATION_EVIDENCE_REF: ${{ inputs.secret_rotation_evidence_ref }}
          OSMU_COMMERCIAL_INTEGRATION_EVIDENCE_REF: ${{ inputs.commercial_integration_evidence_ref }}
          OSMU_COMMERCIAL_APPROVAL_EVIDENCE_REF: ${{ inputs.commercial_approval_evidence_ref }}
          OSMU_COMMERCIAL_INTEGRATION_JSON_BASE64: ${{ inputs.commercial_integration_json_base64 }}
          OSMU_COMMERCIAL_APPROVAL_JSON_BASE64: ${{ inputs.commercial_approval_json_base64 }}
          OSMU_ENTERPRISE_AUTH_EVIDENCE_REF: ${{ inputs.enterprise_auth_evidence_ref }}
          OSMU_ENTERPRISE_AUTH_JSON_BASE64: ${{ inputs.enterprise_auth_json_base64 }}
          OSMU_BACKUP_RESTORE_EVIDENCE_REF: ${{ inputs.backup_restore_evidence_ref }}
          OSMU_HA_DR_EVIDENCE_REF: ${{ inputs.ha_dr_evidence_ref }}
          OSMU_MONITORING_EVIDENCE_REF: ${{ inputs.monitoring_evidence_ref }}
          OSMU_SECURITY_EVIDENCE_REF: ${{ inputs.security_evidence_ref }}
          OSMU_IAM_RBAC_EVIDENCE_REF: ${{ inputs.iam_rbac_evidence_ref }}
          OSMU_RUNBOOK_REVIEW_REF: ${{ inputs.runbook_review_ref }}
          OSMU_TROUBLESHOOTING_REVIEW_REF: ${{ inputs.troubleshooting_review_ref }}
          OSMU_SUPPORT_ESCALATION_REF: ${{ inputs.support_escalation_ref }}
          OSMU_SUPPORT_SLA_REF: ${{ inputs.support_sla_ref }}
          OSMU_KNOWN_GAPS_REF: ${{ inputs.known_gaps_ref }}
          OSMU_CONFIRM_RUNBOOK_REVIEWED: ${{ inputs.confirm_runbook_reviewed }}
          OSMU_CONFIRM_TROUBLESHOOTING_REVIEWED: ${{ inputs.confirm_troubleshooting_reviewed }}
          OSMU_CONFIRM_ROLLBACK_REVIEWED: ${{ inputs.confirm_rollback_reviewed }}
          OSMU_CONFIRM_SUPPORT_ESCALATION_REVIEWED: ${{ inputs.confirm_support_escalation_reviewed }}
          OSMU_CONFIRM_KNOWN_GAPS_ACCEPTED: ${{ inputs.confirm_known_gaps_accepted }}
          OSMU_CONFIRM_OPERATIONS_READINESS_SNAPSHOT_REVIEWED: ${{ inputs.confirm_operations_readiness_snapshot_reviewed }}
          OSMU_CONFIRM_OPERATIONS_CONVERGENCE_SNAPSHOT_REVIEWED: ${{ inputs.confirm_operations_convergence_snapshot_reviewed }}
          OSMU_CONFIRM_DATA_FLOW_STORAGE_PLAN_REVIEWED: ${{ inputs.confirm_data_flow_storage_plan_reviewed }}
          OSMU_CONFIRM_NO_SECRET_VALUES: ${{ inputs.confirm_no_secret_values }}
          OSMU_REQUIRE_PRODUCTION_EVIDENCE: ${{ inputs.require_production_evidence }}
          OSMU_REQUIRE_OPERATIONS_SNAPSHOT_EVIDENCE: ${{ inputs.require_operations_snapshot_evidence }}
          OSMU_FAIL_IF_NOT_PASSED: ${{ inputs.fail_if_not_passed }}
        run: |
          New-Item -ItemType Directory -Force -Path ".osmu-run" | Out-Null
          $temporarySnapshotPaths = New-Object System.Collections.Generic.List[string]
          function Add-Base64SnapshotArgument([string] $InputValue, [string] $Path, [string] $ArgumentName) {
            if ([string]::IsNullOrWhiteSpace($InputValue)) {
              return
            }
            [System.IO.File]::WriteAllBytes($Path, [Convert]::FromBase64String($InputValue))
            [void] $temporarySnapshotPaths.Add($Path)
            $script:packageArgs += @($ArgumentName, $Path)
          }

          $packageArgs = @(
            "-EnvironmentName", $env:OSMU_ENVIRONMENT_NAME,
            "-TargetCluster", $env:OSMU_TARGET_CLUSTER,
            "-Operator", $env:OSMU_OPERATOR,
            "-HandoffStartedAt", $env:OSMU_HANDOFF_STARTED_AT,
            "-HandoffCompletedAt", $env:OSMU_HANDOFF_COMPLETED_AT,
            "-ChangeApprovalRef", $env:OSMU_CHANGE_APPROVAL_REF,
            "-DeploymentEvidenceRef", $env:OSMU_DEPLOYMENT_EVIDENCE_REF,
            "-OperationsReadinessRef", $env:OSMU_OPERATIONS_READINESS_REF,
            "-OperationsConvergenceRef", $env:OSMU_OPERATIONS_CONVERGENCE_REF,
            "-DataFlowStoragePlanEvidenceRef", $env:OSMU_DATA_FLOW_STORAGE_PLAN_EVIDENCE_REF,
            "-SecretRotationEvidenceRef", $env:OSMU_SECRET_ROTATION_EVIDENCE_REF,
            "-CommercialIntegrationEvidenceRef", $env:OSMU_COMMERCIAL_INTEGRATION_EVIDENCE_REF,
            "-CommercialApprovalEvidenceRef", $env:OSMU_COMMERCIAL_APPROVAL_EVIDENCE_REF,
            "-EnterpriseAuthEvidenceRef", $env:OSMU_ENTERPRISE_AUTH_EVIDENCE_REF,
            "-BackupRestoreEvidenceRef", $env:OSMU_BACKUP_RESTORE_EVIDENCE_REF,
            "-HaDrEvidenceRef", $env:OSMU_HA_DR_EVIDENCE_REF,
            "-MonitoringEvidenceRef", $env:OSMU_MONITORING_EVIDENCE_REF,
            "-SecurityEvidenceRef", $env:OSMU_SECURITY_EVIDENCE_REF,
            "-IamRbacEvidenceRef", $env:OSMU_IAM_RBAC_EVIDENCE_REF,
            "-RunbookReviewRef", $env:OSMU_RUNBOOK_REVIEW_REF,
            "-TroubleshootingReviewRef", $env:OSMU_TROUBLESHOOTING_REVIEW_REF,
            "-SupportEscalationRef", $env:OSMU_SUPPORT_ESCALATION_REF,
            "-SupportSlaRef", $env:OSMU_SUPPORT_SLA_REF,
            "-KnownGapsRef", $env:OSMU_KNOWN_GAPS_REF,
            "-JsonOutputPath", ".osmu-run/latest-operations-handoff-package.json",
            "-MarkdownOutputPath", ".osmu-run/latest-operations-handoff-package.md"
          )

          Add-Base64SnapshotArgument $env:OSMU_OPERATIONS_READINESS_JSON_BASE64 ".osmu-run/operations-readiness-handoff-snapshot.json" "-OperationsReadinessJsonPath"
          Add-Base64SnapshotArgument $env:OSMU_OPERATIONS_CONVERGENCE_JSON_BASE64 ".osmu-run/operations-convergence-handoff-snapshot.json" "-OperationsConvergenceJsonPath"
          Add-Base64SnapshotArgument $env:OSMU_DATA_FLOW_STORAGE_PLAN_JSON_BASE64 ".osmu-run/data-flow-storage-plan-handoff-snapshot.json" "-DataFlowStoragePlanJsonPath"
          Add-Base64SnapshotArgument $env:OSMU_COMMERCIAL_INTEGRATION_JSON_BASE64 ".osmu-run/commercial-integration-handoff-snapshot.json" "-CommercialIntegrationJsonPath"
          Add-Base64SnapshotArgument $env:OSMU_COMMERCIAL_APPROVAL_JSON_BASE64 ".osmu-run/commercial-approval-handoff-snapshot.json" "-CommercialApprovalJsonPath"
          Add-Base64SnapshotArgument $env:OSMU_ENTERPRISE_AUTH_JSON_BASE64 ".osmu-run/enterprise-auth-handoff-snapshot.json" "-EnterpriseAuthJsonPath"

          if ($env:OSMU_CONFIRM_RUNBOOK_REVIEWED -eq "true") { $packageArgs += "-ConfirmRunbookReviewed" }
          if ($env:OSMU_CONFIRM_TROUBLESHOOTING_REVIEWED -eq "true") { $packageArgs += "-ConfirmTroubleshootingReviewed" }
          if ($env:OSMU_CONFIRM_ROLLBACK_REVIEWED -eq "true") { $packageArgs += "-ConfirmRollbackReviewed" }
          if ($env:OSMU_CONFIRM_SUPPORT_ESCALATION_REVIEWED -eq "true") { $packageArgs += "-ConfirmSupportEscalationReviewed" }
          if ($env:OSMU_CONFIRM_KNOWN_GAPS_ACCEPTED -eq "true") { $packageArgs += "-ConfirmKnownGapsAccepted" }
          if ($env:OSMU_CONFIRM_OPERATIONS_READINESS_SNAPSHOT_REVIEWED -eq "true") { $packageArgs += "-ConfirmOperationsReadinessSnapshotReviewed" }
          if ($env:OSMU_CONFIRM_OPERATIONS_CONVERGENCE_SNAPSHOT_REVIEWED -eq "true") { $packageArgs += "-ConfirmOperationsConvergenceSnapshotReviewed" }
          if ($env:OSMU_CONFIRM_DATA_FLOW_STORAGE_PLAN_REVIEWED -eq "true") { $packageArgs += "-ConfirmDataFlowStoragePlanReviewed" }
          if ($env:OSMU_CONFIRM_NO_SECRET_VALUES -eq "true") { $packageArgs += "-ConfirmNoSecretValues" }
          if ($env:OSMU_REQUIRE_PRODUCTION_EVIDENCE -eq "true") { $packageArgs += "-RequireProductionEvidence" }
          if ($env:OSMU_REQUIRE_OPERATIONS_SNAPSHOT_EVIDENCE -eq "true") { $packageArgs += "-RequireOperationsSnapshotEvidence" }
          if ($env:OSMU_FAIL_IF_NOT_PASSED -eq "true") { $packageArgs += "-FailIfNotPassed" }

          try {
            ./scripts/write-operations-handoff-package.ps1 @packageArgs
          }
          finally {
            foreach ($path in $temporarySnapshotPaths) {
              Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload operations handoff package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-handoff-package-${{ github.run_id }}
          path: |
            .osmu-run/latest-operations-handoff-package.json
            .osmu-run/latest-operations-handoff-package.md
          if-no-files-found: error
          retention-days: 14
