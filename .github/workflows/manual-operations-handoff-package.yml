name: Manual Operations Handoff Package

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Target environment label
        required: true
        default: prod
      target_cluster:
        description: Target cluster label
        required: true
        default: osmu-prod
      operator:
        description: Operator or team recording the handoff
        required: true
        default: ""
      handoff_started_at:
        description: Handoff start time in ISO-8601 format
        required: true
        default: ""
      handoff_completed_at:
        description: Handoff completion time in ISO-8601 format
        required: true
        default: ""
      change_approval_ref:
        description: External change approval reference
        required: true
        default: ""
      operations_readiness_json_base64:
        description: Optional base64 latest operations readiness JSON snapshot
        required: false
        default: ""
      operations_convergence_json_base64:
        description: Optional base64 latest operations readiness convergence JSON snapshot
        required: false
        default: ""
      data_flow_storage_plan_json_base64:
        description: Optional base64 latest data-flow storage plan JSON snapshot
        required: false
        default: ""
      data_flow_storage_transition_runbook_json_base64:
        description: Optional base64 latest data-flow storage transition runbook evidence JSON snapshot
        required: false
        default: ""
      secret_rotation_json_base64:
        description: Optional base64 latest secret rotation evidence JSON snapshot
        required: false
        default: ""
      commercial_integration_json_base64:
        description: Optional base64 latest commercial integration evidence JSON snapshot
        required: false
        default: ""
      commercial_approval_json_base64:
        description: Optional base64 latest commercial approval evidence JSON snapshot
        required: false
        default: ""
      enterprise_auth_json_base64:
        description: Optional base64 latest enterprise auth smoke JSON snapshot
        required: false
        default: ""
      monitoring_threshold_json_base64:
        description: Optional base64 latest monitoring threshold evidence JSON snapshot
        required: false
        default: ""
      handoff_evidence_payload_json_base64:
        description: Optional base64 JSON containing deployment, readiness, security, support refs, and handoff confirmations
        required: false
        default: ""
      require_production_evidence:
        description: Require all production evidence references
        required: true
        type: boolean
        default: true
      require_operations_snapshot_evidence:
        description: Require readiness and convergence JSON snapshots
        required: true
        type: boolean
        default: true
      fail_if_not_passed:
        description: Fail workflow when package result is not passed
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: manual-operations-handoff-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  operations-handoff-package:
    name: Manual operations handoff package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record operations handoff package
        shell: pwsh
        env:
          OSMU_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          OSMU_TARGET_CLUSTER: ${{ inputs.target_cluster }}
          OSMU_OPERATOR: ${{ inputs.operator }}
          OSMU_HANDOFF_STARTED_AT: ${{ inputs.handoff_started_at }}
          OSMU_HANDOFF_COMPLETED_AT: ${{ inputs.handoff_completed_at }}
          OSMU_CHANGE_APPROVAL_REF: ${{ inputs.change_approval_ref }}
          OSMU_OPERATIONS_READINESS_JSON_BASE64: ${{ inputs.operations_readiness_json_base64 }}
          OSMU_OPERATIONS_CONVERGENCE_JSON_BASE64: ${{ inputs.operations_convergence_json_base64 }}
          OSMU_DATA_FLOW_STORAGE_PLAN_JSON_BASE64: ${{ inputs.data_flow_storage_plan_json_base64 }}
          OSMU_DATA_FLOW_STORAGE_TRANSITION_RUNBOOK_JSON_BASE64: ${{ inputs.data_flow_storage_transition_runbook_json_base64 }}
          OSMU_SECRET_ROTATION_JSON_BASE64: ${{ inputs.secret_rotation_json_base64 }}
          OSMU_COMMERCIAL_INTEGRATION_JSON_BASE64: ${{ inputs.commercial_integration_json_base64 }}
          OSMU_COMMERCIAL_APPROVAL_JSON_BASE64: ${{ inputs.commercial_approval_json_base64 }}
          OSMU_ENTERPRISE_AUTH_JSON_BASE64: ${{ inputs.enterprise_auth_json_base64 }}
          OSMU_MONITORING_THRESHOLD_JSON_BASE64: ${{ inputs.monitoring_threshold_json_base64 }}
          OSMU_HANDOFF_EVIDENCE_PAYLOAD_JSON_BASE64: ${{ inputs.handoff_evidence_payload_json_base64 }}
          OSMU_REQUIRE_PRODUCTION_EVIDENCE: ${{ inputs.require_production_evidence }}
          OSMU_REQUIRE_OPERATIONS_SNAPSHOT_EVIDENCE: ${{ inputs.require_operations_snapshot_evidence }}
          OSMU_FAIL_IF_NOT_PASSED: ${{ inputs.fail_if_not_passed }}
        run: |
          $payload = [pscustomobject]@{}
          if (-not [string]::IsNullOrWhiteSpace($env:OSMU_HANDOFF_EVIDENCE_PAYLOAD_JSON_BASE64)) {
            $payloadText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:OSMU_HANDOFF_EVIDENCE_PAYLOAD_JSON_BASE64))
            $payload = $payloadText | ConvertFrom-Json
          }

          function Get-DispatchString([string] $Name, [string] $Default = "") {
            $property = $payload.PSObject.Properties[$Name]
            if ($null -eq $property -or $null -eq $property.Value) {
              return $Default
            }
            return [string] $property.Value
          }

          function Test-DispatchTrue([string] $Name, [bool] $Default = $false) {
            $property = $payload.PSObject.Properties[$Name]
            if ($null -eq $property -or $null -eq $property.Value) {
              return $Default
            }
            if ($property.Value -is [bool]) {
              return [bool] $property.Value
            }
            return [string] $property.Value -eq "true"
          }

          New-Item -ItemType Directory -Force -Path ".osmu-run" | Out-Null
          $temporarySnapshotPaths = New-Object System.Collections.Generic.List[string]
          function Add-Base64SnapshotArgument([string] $InputValue, [string] $Path, [string] $ArgumentName) {
            if ([string]::IsNullOrWhiteSpace($InputValue)) {
              return
            }
            [System.IO.File]::WriteAllBytes($Path, [Convert]::FromBase64String($InputValue))
            [void] $temporarySnapshotPaths.Add($Path)
            $script:packageArgs += @($ArgumentName, $Path)
          }

          $packageArgs = @(
            "-EnvironmentName", $env:OSMU_ENVIRONMENT_NAME,
            "-TargetCluster", $env:OSMU_TARGET_CLUSTER,
            "-Operator", $env:OSMU_OPERATOR,
            "-HandoffStartedAt", $env:OSMU_HANDOFF_STARTED_AT,
            "-HandoffCompletedAt", $env:OSMU_HANDOFF_COMPLETED_AT,
            "-ChangeApprovalRef", $env:OSMU_CHANGE_APPROVAL_REF,
            "-DeploymentEvidenceRef", (Get-DispatchString "deployment_evidence_ref"),
            "-OperationsReadinessRef", (Get-DispatchString "operations_readiness_ref"),
            "-OperationsConvergenceRef", (Get-DispatchString "operations_convergence_ref"),
            "-DataFlowStoragePlanEvidenceRef", (Get-DispatchString "data_flow_storage_plan_evidence_ref"),
            "-DataFlowStorageTransitionRunbookEvidenceRef", (Get-DispatchString "data_flow_storage_transition_runbook_evidence_ref"),
            "-SecretRotationEvidenceRef", (Get-DispatchString "secret_rotation_evidence_ref"),
            "-CommercialIntegrationEvidenceRef", (Get-DispatchString "commercial_integration_evidence_ref"),
            "-CommercialApprovalEvidenceRef", (Get-DispatchString "commercial_approval_evidence_ref"),
            "-EnterpriseAuthEvidenceRef", (Get-DispatchString "enterprise_auth_evidence_ref"),
            "-BackupRestoreEvidenceRef", (Get-DispatchString "backup_restore_evidence_ref"),
            "-HaDrEvidenceRef", (Get-DispatchString "ha_dr_evidence_ref"),
            "-MonitoringEvidenceRef", (Get-DispatchString "monitoring_evidence_ref"),
            "-SecurityEvidenceRef", (Get-DispatchString "security_evidence_ref"),
            "-IamRbacEvidenceRef", (Get-DispatchString "iam_rbac_evidence_ref"),
            "-RunbookReviewRef", (Get-DispatchString "runbook_review_ref"),
            "-TroubleshootingReviewRef", (Get-DispatchString "troubleshooting_review_ref"),
            "-SupportEscalationRef", (Get-DispatchString "support_escalation_ref"),
            "-SupportSlaRef", (Get-DispatchString "support_sla_ref"),
            "-KnownGapsRef", (Get-DispatchString "known_gaps_ref"),
            "-JsonOutputPath", ".osmu-run/latest-operations-handoff-package.json",
            "-MarkdownOutputPath", ".osmu-run/latest-operations-handoff-package.md"
          )

          Add-Base64SnapshotArgument (Get-DispatchString "operations_readiness_json_base64" $env:OSMU_OPERATIONS_READINESS_JSON_BASE64) ".osmu-run/operations-readiness-handoff-snapshot.json" "-OperationsReadinessJsonPath"
          Add-Base64SnapshotArgument (Get-DispatchString "operations_convergence_json_base64" $env:OSMU_OPERATIONS_CONVERGENCE_JSON_BASE64) ".osmu-run/operations-convergence-handoff-snapshot.json" "-OperationsConvergenceJsonPath"
          Add-Base64SnapshotArgument (Get-DispatchString "data_flow_storage_plan_json_base64" $env:OSMU_DATA_FLOW_STORAGE_PLAN_JSON_BASE64) ".osmu-run/data-flow-storage-plan-handoff-snapshot.json" "-DataFlowStoragePlanJsonPath"
          Add-Base64SnapshotArgument (Get-DispatchString "data_flow_storage_transition_runbook_json_base64" $env:OSMU_DATA_FLOW_STORAGE_TRANSITION_RUNBOOK_JSON_BASE64) ".osmu-run/data-flow-storage-transition-runbook-handoff-snapshot.json" "-DataFlowStorageTransitionRunbookJsonPath"
          Add-Base64SnapshotArgument (Get-DispatchString "secret_rotation_json_base64" $env:OSMU_SECRET_ROTATION_JSON_BASE64) ".osmu-run/secret-rotation-handoff-snapshot.json" "-SecretRotationJsonPath"
          Add-Base64SnapshotArgument (Get-DispatchString "commercial_integration_json_base64" $env:OSMU_COMMERCIAL_INTEGRATION_JSON_BASE64) ".osmu-run/commercial-integration-handoff-snapshot.json" "-CommercialIntegrationJsonPath"
          Add-Base64SnapshotArgument (Get-DispatchString "commercial_approval_json_base64" $env:OSMU_COMMERCIAL_APPROVAL_JSON_BASE64) ".osmu-run/commercial-approval-handoff-snapshot.json" "-CommercialApprovalJsonPath"
          Add-Base64SnapshotArgument (Get-DispatchString "enterprise_auth_json_base64" $env:OSMU_ENTERPRISE_AUTH_JSON_BASE64) ".osmu-run/enterprise-auth-handoff-snapshot.json" "-EnterpriseAuthJsonPath"
          Add-Base64SnapshotArgument (Get-DispatchString "monitoring_threshold_json_base64" $env:OSMU_MONITORING_THRESHOLD_JSON_BASE64) ".osmu-run/monitoring-threshold-handoff-snapshot.json" "-MonitoringThresholdJsonPath"

          if (Test-DispatchTrue "confirm_runbook_reviewed") { $packageArgs += "-ConfirmRunbookReviewed" }
          if (Test-DispatchTrue "confirm_troubleshooting_reviewed") { $packageArgs += "-ConfirmTroubleshootingReviewed" }
          if (Test-DispatchTrue "confirm_rollback_reviewed") { $packageArgs += "-ConfirmRollbackReviewed" }
          if (Test-DispatchTrue "confirm_support_escalation_reviewed") { $packageArgs += "-ConfirmSupportEscalationReviewed" }
          if (Test-DispatchTrue "confirm_known_gaps_accepted") { $packageArgs += "-ConfirmKnownGapsAccepted" }
          if (Test-DispatchTrue "confirm_operations_readiness_snapshot_reviewed") { $packageArgs += "-ConfirmOperationsReadinessSnapshotReviewed" }
          if (Test-DispatchTrue "confirm_operations_convergence_snapshot_reviewed") { $packageArgs += "-ConfirmOperationsConvergenceSnapshotReviewed" }
          if (Test-DispatchTrue "confirm_data_flow_storage_plan_reviewed") { $packageArgs += "-ConfirmDataFlowStoragePlanReviewed" }
          if (Test-DispatchTrue "confirm_data_flow_storage_transition_runbook_reviewed") { $packageArgs += "-ConfirmDataFlowStorageTransitionRunbookReviewed" }
          if (Test-DispatchTrue "confirm_secret_rotation_snapshot_reviewed") { $packageArgs += "-ConfirmSecretRotationSnapshotReviewed" }
          if (Test-DispatchTrue "confirm_commercial_integration_snapshot_reviewed") { $packageArgs += "-ConfirmCommercialIntegrationSnapshotReviewed" }
          if (Test-DispatchTrue "confirm_commercial_approval_snapshot_reviewed") { $packageArgs += "-ConfirmCommercialApprovalSnapshotReviewed" }
          if (Test-DispatchTrue "confirm_enterprise_auth_smoke_snapshot_reviewed") { $packageArgs += "-ConfirmEnterpriseAuthSmokeSnapshotReviewed" }
          if (Test-DispatchTrue "confirm_monitoring_threshold_reviewed") { $packageArgs += "-ConfirmMonitoringThresholdReviewed" }
          if (Test-DispatchTrue "confirm_no_secret_values") { $packageArgs += "-ConfirmNoSecretValues" }
          if (Test-DispatchTrue "require_production_evidence" ($env:OSMU_REQUIRE_PRODUCTION_EVIDENCE -eq "true")) { $packageArgs += "-RequireProductionEvidence" }
          if (Test-DispatchTrue "require_operations_snapshot_evidence" ($env:OSMU_REQUIRE_OPERATIONS_SNAPSHOT_EVIDENCE -eq "true")) { $packageArgs += "-RequireOperationsSnapshotEvidence" }
          if ($env:OSMU_FAIL_IF_NOT_PASSED -eq "true") { $packageArgs += "-FailIfNotPassed" }

          try {
            ./scripts/write-operations-handoff-package.ps1 @packageArgs
          }
          finally {
            foreach ($path in $temporarySnapshotPaths) {
              Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Upload operations handoff package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-handoff-package-${{ github.run_id }}
          path: |
            .osmu-run/latest-operations-handoff-package.json
            .osmu-run/latest-operations-handoff-package.md
          if-no-files-found: error
          retention-days: 14
