name: Enterprise Auth Smoke CI

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: Target OSMU Backend API base URL
        required: true
        default: http://localhost:8080/api
      admin_login_id:
        description: Admin login id for enterprise auth smoke
        required: true
        default: admin
      run_live:
        description: Execute HTTP checks against the target API
        required: true
        type: boolean
        default: false
      require_oidc:
        description: Require OIDC authorize/callback checks to pass
        required: true
        type: boolean
        default: false
      require_ldap:
        description: Require LDAP bind/search login check to pass
        required: true
        type: boolean
        default: false
      confirm_jit_provision:
        description: Allow admin-approved OIDC JIT provisioning request
        required: true
        type: boolean
        default: false
      expected_email:
        description: Optional expected email to find in OIDC/LDAP login responses
        required: false
        default: ""
      fail_if_not_passed:
        description: Fail workflow when live enterprise auth smoke does not pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: enterprise-auth-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enterprise-auth-smoke:
    name: Enterprise auth smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Plan enterprise auth smoke
        shell: pwsh
        run: |
          ./scripts/write-enterprise-auth-smoke-plan.ps1 `
            -ApiBase "${{ inputs.api_base }}" `
            -AdminLoginId "${{ inputs.admin_login_id }}" `
            -JsonOutputPath ".osmu-run/latest-enterprise-auth-smoke-plan.json" `
            -MarkdownOutputPath ".osmu-run/latest-enterprise-auth-smoke-plan.md"

      - name: Run enterprise auth smoke
        if: ${{ inputs.run_live }}
        shell: pwsh
        env:
          OSMU_ENTERPRISE_AUTH_ADMIN_PASSWORD: ${{ secrets.OSMU_ENTERPRISE_AUTH_ADMIN_PASSWORD }}
          OSMU_ENTERPRISE_AUTH_LDAP_LOGIN_ID: ${{ secrets.OSMU_ENTERPRISE_AUTH_LDAP_LOGIN_ID }}
          OSMU_ENTERPRISE_AUTH_LDAP_PASSWORD: ${{ secrets.OSMU_ENTERPRISE_AUTH_LDAP_PASSWORD }}
          OSMU_ENTERPRISE_AUTH_OIDC_CALLBACK_CODE: ${{ secrets.OSMU_ENTERPRISE_AUTH_OIDC_CALLBACK_CODE }}
          OSMU_ENTERPRISE_AUTH_OIDC_CALLBACK_STATE: ${{ secrets.OSMU_ENTERPRISE_AUTH_OIDC_CALLBACK_STATE }}
          OSMU_ENTERPRISE_AUTH_CLAIM_PREVIEW_JSON_BASE64: ${{ secrets.OSMU_ENTERPRISE_AUTH_CLAIM_PREVIEW_JSON_BASE64 }}
          OSMU_ENTERPRISE_AUTH_JIT_PROVISION_JSON_BASE64: ${{ secrets.OSMU_ENTERPRISE_AUTH_JIT_PROVISION_JSON_BASE64 }}
        run: |
          if (-not $env:OSMU_ENTERPRISE_AUTH_ADMIN_PASSWORD) {
            throw "OSMU_ENTERPRISE_AUTH_ADMIN_PASSWORD secret is required when run_live=true."
          }
          if ("${{ inputs.require_ldap }}" -eq "true" -and (-not $env:OSMU_ENTERPRISE_AUTH_LDAP_LOGIN_ID -or -not $env:OSMU_ENTERPRISE_AUTH_LDAP_PASSWORD)) {
            throw "OSMU_ENTERPRISE_AUTH_LDAP_LOGIN_ID and OSMU_ENTERPRISE_AUTH_LDAP_PASSWORD secrets are required when require_ldap=true."
          }
          if ("${{ inputs.confirm_jit_provision }}" -eq "true" -and -not $env:OSMU_ENTERPRISE_AUTH_JIT_PROVISION_JSON_BASE64) {
            throw "OSMU_ENTERPRISE_AUTH_JIT_PROVISION_JSON_BASE64 secret is required when confirm_jit_provision=true."
          }

          $inputDir = ".osmu-run/enterprise-auth-inputs"
          New-Item -ItemType Directory -Force -Path $inputDir | Out-Null
          $claimPreviewPath = ""
          $jitProvisionPath = ""
          if ($env:OSMU_ENTERPRISE_AUTH_CLAIM_PREVIEW_JSON_BASE64) {
            $claimPreviewPath = Join-Path $inputDir "claim-preview.json"
            [IO.File]::WriteAllBytes($claimPreviewPath, [Convert]::FromBase64String($env:OSMU_ENTERPRISE_AUTH_CLAIM_PREVIEW_JSON_BASE64))
          }
          if ($env:OSMU_ENTERPRISE_AUTH_JIT_PROVISION_JSON_BASE64) {
            $jitProvisionPath = Join-Path $inputDir "jit-provision.json"
            [IO.File]::WriteAllBytes($jitProvisionPath, [Convert]::FromBase64String($env:OSMU_ENTERPRISE_AUTH_JIT_PROVISION_JSON_BASE64))
          }

          $smokeArgs = @(
            "-Execute",
            "-ApiBase", "${{ inputs.api_base }}",
            "-AdminLoginId", "${{ inputs.admin_login_id }}",
            "-AdminPassword", $env:OSMU_ENTERPRISE_AUTH_ADMIN_PASSWORD,
            "-JsonOutputPath", ".osmu-run/latest-enterprise-auth-smoke.json",
            "-MarkdownOutputPath", ".osmu-run/latest-enterprise-auth-smoke.md"
          )
          if ("${{ inputs.require_oidc }}" -eq "true") {
            $smokeArgs += "-RequireOidc"
          }
          if ("${{ inputs.require_ldap }}" -eq "true") {
            $smokeArgs += "-RequireLdap"
          }
          if ("${{ inputs.fail_if_not_passed }}" -eq "true") {
            $smokeArgs += "-FailIfNotPassed"
          }
          if ("${{ inputs.confirm_jit_provision }}" -eq "true") {
            $smokeArgs += "-ConfirmJitProvision"
          }
          if ("${{ inputs.expected_email }}" -ne "") {
            $smokeArgs += @("-ExpectedEmail", "${{ inputs.expected_email }}")
          }
          if ($env:OSMU_ENTERPRISE_AUTH_LDAP_LOGIN_ID -and $env:OSMU_ENTERPRISE_AUTH_LDAP_PASSWORD) {
            $smokeArgs += @("-LdapLoginId", $env:OSMU_ENTERPRISE_AUTH_LDAP_LOGIN_ID, "-LdapPassword", $env:OSMU_ENTERPRISE_AUTH_LDAP_PASSWORD)
          }
          if ($env:OSMU_ENTERPRISE_AUTH_OIDC_CALLBACK_CODE -and $env:OSMU_ENTERPRISE_AUTH_OIDC_CALLBACK_STATE) {
            $smokeArgs += @("-OidcCallbackCode", $env:OSMU_ENTERPRISE_AUTH_OIDC_CALLBACK_CODE, "-OidcCallbackState", $env:OSMU_ENTERPRISE_AUTH_OIDC_CALLBACK_STATE)
          }
          if ($claimPreviewPath) {
            $smokeArgs += @("-OidcClaimPreviewJsonPath", $claimPreviewPath)
          }
          if ($jitProvisionPath) {
            $smokeArgs += @("-OidcJitProvisionJsonPath", $jitProvisionPath)
          }

          ./scripts/write-enterprise-auth-smoke-plan.ps1 @smokeArgs

      - name: Promote plan-only enterprise auth smoke
        if: ${{ !inputs.run_live }}
        shell: pwsh
        run: |
          Copy-Item -LiteralPath ".osmu-run/latest-enterprise-auth-smoke-plan.json" -Destination ".osmu-run/latest-enterprise-auth-smoke.json" -Force
          Copy-Item -LiteralPath ".osmu-run/latest-enterprise-auth-smoke-plan.md" -Destination ".osmu-run/latest-enterprise-auth-smoke.md" -Force

      - name: Upload enterprise auth smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-auth-smoke-${{ github.run_id }}
          path: |
            .osmu-run/latest-enterprise-auth-smoke.json
            .osmu-run/latest-enterprise-auth-smoke.md
            .osmu-run/latest-enterprise-auth-smoke-plan.json
            .osmu-run/latest-enterprise-auth-smoke-plan.md
          if-no-files-found: warn
          retention-days: 14
