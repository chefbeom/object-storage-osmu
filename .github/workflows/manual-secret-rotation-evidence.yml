name: Manual Secret Rotation Evidence

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Target environment label
        required: true
        default: prod
      target_cluster:
        description: Target cluster label
        required: true
        default: osmu-prod
      operator:
        description: Operator or team recording the evidence
        required: true
        default: ""
      rotation_started_at:
        description: Rotation start time in ISO-8601 format
        required: true
        default: ""
      rotation_completed_at:
        description: Rotation completion time in ISO-8601 format
        required: true
        default: ""
      change_approval_ref:
        description: External change approval reference
        required: true
        default: ""
      secret_manager_evidence_ref:
        description: External secret manager audit reference
        required: true
        default: ""
      workload_restart_evidence_ref:
        description: External workload restart or reload reference
        required: true
        default: ""
      smoke_evidence_ref:
        description: External post-rotation smoke evidence reference
        required: true
        default: ""
      artifact_leak_review_evidence_ref:
        description: External artifact/log leak review reference
        required: true
        default: ""
      access_key_encryption_decision_ref:
        description: External access-key encryption migration decision reference
        required: false
        default: ""
      rotate_admin_password:
        description: Confirm admin password rotation
        required: true
        type: boolean
        default: false
      rotate_jwt_signing_secret:
        description: Confirm JWT signing secret rotation
        required: true
        type: boolean
        default: false
      rotate_database_credentials:
        description: Confirm database credential rotation
        required: true
        type: boolean
        default: false
      rotate_minio_root_credentials:
        description: Confirm MinIO root credential rotation
        required: true
        type: boolean
        default: false
      rotate_tls_certificate:
        description: Confirm TLS certificate rotation
        required: true
        type: boolean
        default: false
      rotate_access_key_encryption_key:
        description: Confirm access-key encryption key rotation or migration
        required: true
        type: boolean
        default: false
      rotate_oidc_or_ldap_secrets:
        description: Confirm OIDC or LDAP secret rotation
        required: true
        type: boolean
        default: false
      rotate_smtp_or_webhook_secrets:
        description: Confirm SMTP or webhook signing secret rotation
        required: true
        type: boolean
        default: false
      confirm_no_secret_values:
        description: Confirm inputs contain references only, not secret values
        required: true
        type: boolean
        default: false
      confirm_workload_restart:
        description: Confirm workloads were restarted or reloaded
        required: true
        type: boolean
        default: false
      confirm_smoke_passed:
        description: Confirm post-rotation smoke passed
        required: true
        type: boolean
        default: false
      confirm_artifact_leak_review:
        description: Confirm release/log artifacts were reviewed for leakage
        required: true
        type: boolean
        default: false
      require_all_core_secrets:
        description: Require all core secret/certificate rotations
        required: true
        type: boolean
        default: true
      fail_if_not_passed:
        description: Fail workflow when evidence result is not passed
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: manual-secret-rotation-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-rotation-evidence:
    name: Manual secret rotation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record secret rotation evidence
        shell: pwsh
        env:
          OSMU_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          OSMU_TARGET_CLUSTER: ${{ inputs.target_cluster }}
          OSMU_OPERATOR: ${{ inputs.operator }}
          OSMU_ROTATION_STARTED_AT: ${{ inputs.rotation_started_at }}
          OSMU_ROTATION_COMPLETED_AT: ${{ inputs.rotation_completed_at }}
          OSMU_CHANGE_APPROVAL_REF: ${{ inputs.change_approval_ref }}
          OSMU_SECRET_MANAGER_EVIDENCE_REF: ${{ inputs.secret_manager_evidence_ref }}
          OSMU_WORKLOAD_RESTART_EVIDENCE_REF: ${{ inputs.workload_restart_evidence_ref }}
          OSMU_SMOKE_EVIDENCE_REF: ${{ inputs.smoke_evidence_ref }}
          OSMU_ARTIFACT_LEAK_REVIEW_EVIDENCE_REF: ${{ inputs.artifact_leak_review_evidence_ref }}
          OSMU_ACCESS_KEY_ENCRYPTION_DECISION_REF: ${{ inputs.access_key_encryption_decision_ref }}
          OSMU_ROTATE_ADMIN_PASSWORD: ${{ inputs.rotate_admin_password }}
          OSMU_ROTATE_JWT_SIGNING_SECRET: ${{ inputs.rotate_jwt_signing_secret }}
          OSMU_ROTATE_DATABASE_CREDENTIALS: ${{ inputs.rotate_database_credentials }}
          OSMU_ROTATE_MINIO_ROOT_CREDENTIALS: ${{ inputs.rotate_minio_root_credentials }}
          OSMU_ROTATE_TLS_CERTIFICATE: ${{ inputs.rotate_tls_certificate }}
          OSMU_ROTATE_ACCESS_KEY_ENCRYPTION_KEY: ${{ inputs.rotate_access_key_encryption_key }}
          OSMU_ROTATE_OIDC_OR_LDAP_SECRETS: ${{ inputs.rotate_oidc_or_ldap_secrets }}
          OSMU_ROTATE_SMTP_OR_WEBHOOK_SECRETS: ${{ inputs.rotate_smtp_or_webhook_secrets }}
          OSMU_CONFIRM_NO_SECRET_VALUES: ${{ inputs.confirm_no_secret_values }}
          OSMU_CONFIRM_WORKLOAD_RESTART: ${{ inputs.confirm_workload_restart }}
          OSMU_CONFIRM_SMOKE_PASSED: ${{ inputs.confirm_smoke_passed }}
          OSMU_CONFIRM_ARTIFACT_LEAK_REVIEW: ${{ inputs.confirm_artifact_leak_review }}
          OSMU_REQUIRE_ALL_CORE_SECRETS: ${{ inputs.require_all_core_secrets }}
          OSMU_FAIL_IF_NOT_PASSED: ${{ inputs.fail_if_not_passed }}
        run: |
          $evidenceArgs = @(
            "-EnvironmentName", $env:OSMU_ENVIRONMENT_NAME,
            "-TargetCluster", $env:OSMU_TARGET_CLUSTER,
            "-Operator", $env:OSMU_OPERATOR,
            "-RotationStartedAt", $env:OSMU_ROTATION_STARTED_AT,
            "-RotationCompletedAt", $env:OSMU_ROTATION_COMPLETED_AT,
            "-ChangeApprovalRef", $env:OSMU_CHANGE_APPROVAL_REF,
            "-SecretManagerEvidenceRef", $env:OSMU_SECRET_MANAGER_EVIDENCE_REF,
            "-WorkloadRestartEvidenceRef", $env:OSMU_WORKLOAD_RESTART_EVIDENCE_REF,
            "-SmokeEvidenceRef", $env:OSMU_SMOKE_EVIDENCE_REF,
            "-ArtifactLeakReviewEvidenceRef", $env:OSMU_ARTIFACT_LEAK_REVIEW_EVIDENCE_REF,
            "-AccessKeyEncryptionDecisionRef", $env:OSMU_ACCESS_KEY_ENCRYPTION_DECISION_REF,
            "-JsonOutputPath", ".osmu-run/latest-secret-rotation-evidence.json",
            "-MarkdownOutputPath", ".osmu-run/latest-secret-rotation-evidence.md"
          )

          if ($env:OSMU_ROTATE_ADMIN_PASSWORD -eq "true") { $evidenceArgs += "-RotateAdminPassword" }
          if ($env:OSMU_ROTATE_JWT_SIGNING_SECRET -eq "true") { $evidenceArgs += "-RotateJwtSigningSecret" }
          if ($env:OSMU_ROTATE_DATABASE_CREDENTIALS -eq "true") { $evidenceArgs += "-RotateDatabaseCredentials" }
          if ($env:OSMU_ROTATE_MINIO_ROOT_CREDENTIALS -eq "true") { $evidenceArgs += "-RotateMinioRootCredentials" }
          if ($env:OSMU_ROTATE_TLS_CERTIFICATE -eq "true") { $evidenceArgs += "-RotateTlsCertificate" }
          if ($env:OSMU_ROTATE_ACCESS_KEY_ENCRYPTION_KEY -eq "true") { $evidenceArgs += "-RotateAccessKeyEncryptionKey" }
          if ($env:OSMU_ROTATE_OIDC_OR_LDAP_SECRETS -eq "true") { $evidenceArgs += "-RotateOidcOrLdapSecrets" }
          if ($env:OSMU_ROTATE_SMTP_OR_WEBHOOK_SECRETS -eq "true") { $evidenceArgs += "-RotateSmtpOrWebhookSecrets" }
          if ($env:OSMU_CONFIRM_NO_SECRET_VALUES -eq "true") { $evidenceArgs += "-ConfirmNoSecretValues" }
          if ($env:OSMU_CONFIRM_WORKLOAD_RESTART -eq "true") { $evidenceArgs += "-ConfirmWorkloadRestart" }
          if ($env:OSMU_CONFIRM_SMOKE_PASSED -eq "true") { $evidenceArgs += "-ConfirmSmokePassed" }
          if ($env:OSMU_CONFIRM_ARTIFACT_LEAK_REVIEW -eq "true") { $evidenceArgs += "-ConfirmArtifactLeakReview" }
          if ($env:OSMU_REQUIRE_ALL_CORE_SECRETS -eq "true") { $evidenceArgs += "-RequireAllCoreSecrets" }
          if ($env:OSMU_FAIL_IF_NOT_PASSED -eq "true") { $evidenceArgs += "-FailIfNotPassed" }

          ./scripts/write-secret-rotation-evidence.ps1 @evidenceArgs

      - name: Upload secret rotation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-rotation-evidence-${{ github.run_id }}
          path: |
            .osmu-run/latest-secret-rotation-evidence.json
            .osmu-run/latest-secret-rotation-evidence.md
          if-no-files-found: error
          retention-days: 14
