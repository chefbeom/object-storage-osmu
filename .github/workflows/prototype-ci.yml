name: Prototype CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify lightweight prototype
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: osmu-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: osmu-frontend
        shell: pwsh
        run: npm ci

      - name: Verify local prototype gate
        shell: pwsh
        run: .\scripts\verify-local.ps1 -SkipDocker
