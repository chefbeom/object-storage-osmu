name: Operations Readiness Artifact Finalizer CI

on:
  workflow_dispatch:
    inputs:
      artifact_sources_json_base64:
        description: Optional base64 JSON mapping *_run_id and *_artifact_name fields for evidence artifact downloads
        required: false
        default: ""
      data_flow_storage_plan_json_base64:
        description: Optional base64-encoded latest-data-flow-storage-plan.json evidence to import directly. MariaDB/dual-write plans must include sanitized query-plan evidence summary.
        required: false
        default: ""
      data_flow_query_retention_budget_json_base64:
        description: Optional base64-encoded latest-data-flow-query-retention-budget-evidence.json evidence to import directly. Must be sanitized and result=passed.
        required: false
        default: ""
      data_flow_storage_transition_runbook_json_base64:
        description: Optional base64-encoded latest-data-flow-storage-transition-runbook-evidence.json evidence to import directly. Must be sanitized and result=passed.
        required: false
        default: ""
      fail_if_not_ready:
        description: Fail workflow when operations readiness remains pending
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: operations-readiness-artifact-finalizer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  operations-readiness-artifact-finalizer:
    name: Operations readiness artifact finalizer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve artifact dispatch inputs
        id: artifact_inputs
        shell: pwsh
        env:
          OSMU_ARTIFACT_SOURCES_JSON_BASE64: ${{ inputs.artifact_sources_json_base64 }}
        run: |
          $payload = [pscustomobject]@{}
          if (-not [string]::IsNullOrWhiteSpace($env:OSMU_ARTIFACT_SOURCES_JSON_BASE64)) {
            $payloadText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:OSMU_ARTIFACT_SOURCES_JSON_BASE64))
            $payload = $payloadText | ConvertFrom-Json
          }

          function Get-ArtifactInput([string] $Name) {
            $property = $payload.PSObject.Properties[$Name]
            if ($null -eq $property -or $null -eq $property.Value) {
              return ""
            }
            return ([string] $property.Value).Replace("`r", "").Replace("`n", "")
          }

          $artifactInputNames = @(
            "storage_expansion_run_id",
            "storage_expansion_artifact_name",
            "ha_dr_readiness_run_id",
            "ha_dr_readiness_artifact_name",
            "kubernetes_dr_run_id",
            "kubernetes_dr_artifact_name",
            "iam_rbac_run_id",
            "iam_rbac_artifact_name",
            "security_evidence_run_id",
            "security_evidence_artifact_name",
            "storage_backend_telemetry_run_id",
            "storage_backend_telemetry_artifact_name",
            "minio_bucket_cors_run_id",
            "minio_bucket_cors_artifact_name",
            "monitoring_threshold_run_id",
            "monitoring_threshold_artifact_name",
            "secret_rotation_run_id",
            "secret_rotation_artifact_name",
            "cluster_network_access_review_run_id",
            "cluster_network_access_review_artifact_name",
            "helm_values_hardening_run_id",
            "helm_values_hardening_artifact_name",
            "support_escalation_handoff_run_id",
            "support_escalation_handoff_artifact_name",
            "commercial_integration_run_id",
            "commercial_integration_artifact_name",
            "commercial_approval_run_id",
            "commercial_approval_artifact_name",
            "chargeback_closeout_run_id",
            "chargeback_closeout_artifact_name",
            "enterprise_auth_run_id",
            "enterprise_auth_artifact_name",
            "enterprise_auth_jit_rollback_run_id",
            "enterprise_auth_jit_rollback_artifact_name",
            "operations_handoff_package_run_id",
            "operations_handoff_package_artifact_name",
            "data_flow_storage_plan_run_id",
            "data_flow_storage_plan_artifact_name",
            "data_flow_query_retention_budget_run_id",
            "data_flow_query_retention_budget_artifact_name",
            "data_flow_storage_transition_runbook_run_id",
            "data_flow_storage_transition_runbook_artifact_name",
            "kubernetes_operations_report_sync_run_id",
            "kubernetes_operations_report_sync_artifact_name"
          )
          foreach ($name in $artifactInputNames) {
            "$name=$(Get-ArtifactInput $name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Restore direct data-flow storage plan evidence
        if: ${{ inputs.data_flow_storage_plan_json_base64 != '' }}
        shell: pwsh
        env:
          OSMU_DATA_FLOW_STORAGE_PLAN_JSON_BASE64: ${{ inputs.data_flow_storage_plan_json_base64 }}
        run: |
          $artifactPath = ".osmu-run/operations-readiness-artifacts/data-flow-storage-plan"
          New-Item -ItemType Directory -Force -Path $artifactPath | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $artifactPath "latest-data-flow-storage-plan.json"),
            [Convert]::FromBase64String($env:OSMU_DATA_FLOW_STORAGE_PLAN_JSON_BASE64)
          )

      - name: Restore direct data-flow query/retention budget evidence
        if: ${{ inputs.data_flow_query_retention_budget_json_base64 != '' }}
        shell: pwsh
        env:
          OSMU_DATA_FLOW_QUERY_RETENTION_BUDGET_JSON_BASE64: ${{ inputs.data_flow_query_retention_budget_json_base64 }}
        run: |
          $artifactPath = ".osmu-run/operations-readiness-artifacts/data-flow-query-retention-budget"
          New-Item -ItemType Directory -Force -Path $artifactPath | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $artifactPath "latest-data-flow-query-retention-budget-evidence.json"),
            [Convert]::FromBase64String($env:OSMU_DATA_FLOW_QUERY_RETENTION_BUDGET_JSON_BASE64)
          )

      - name: Restore direct data-flow storage transition runbook evidence
        if: ${{ inputs.data_flow_storage_transition_runbook_json_base64 != '' }}
        shell: pwsh
        env:
          OSMU_DATA_FLOW_STORAGE_TRANSITION_RUNBOOK_JSON_BASE64: ${{ inputs.data_flow_storage_transition_runbook_json_base64 }}
        run: |
          $artifactPath = ".osmu-run/operations-readiness-artifacts/data-flow-storage-transition-runbook"
          New-Item -ItemType Directory -Force -Path $artifactPath | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $artifactPath "latest-data-flow-storage-transition-runbook-evidence.json"),
            [Convert]::FromBase64String($env:OSMU_DATA_FLOW_STORAGE_TRANSITION_RUNBOOK_JSON_BASE64)
          )

      - name: Download storage expansion evidence
        if: ${{ steps.artifact_inputs.outputs.storage_expansion_run_id != '' && steps.artifact_inputs.outputs.storage_expansion_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.storage_expansion_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.storage_expansion_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/storage-expansion

      - name: Download Kubernetes HA DR readiness evidence
        if: ${{ steps.artifact_inputs.outputs.ha_dr_readiness_run_id != '' && steps.artifact_inputs.outputs.ha_dr_readiness_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.ha_dr_readiness_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.ha_dr_readiness_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/ha-dr-readiness

      - name: Download Kubernetes DR finalizer evidence
        if: ${{ steps.artifact_inputs.outputs.kubernetes_dr_run_id != '' && steps.artifact_inputs.outputs.kubernetes_dr_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.kubernetes_dr_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.kubernetes_dr_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/kubernetes-dr

      - name: Download IAM RBAC finalizer evidence
        if: ${{ steps.artifact_inputs.outputs.iam_rbac_run_id != '' && steps.artifact_inputs.outputs.iam_rbac_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.iam_rbac_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.iam_rbac_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/iam-rbac

      - name: Download security evidence finalizer artifact
        if: ${{ steps.artifact_inputs.outputs.security_evidence_run_id != '' && steps.artifact_inputs.outputs.security_evidence_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.security_evidence_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.security_evidence_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/security-evidence

      - name: Download storage backend telemetry evidence
        if: ${{ steps.artifact_inputs.outputs.storage_backend_telemetry_run_id != '' && steps.artifact_inputs.outputs.storage_backend_telemetry_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.storage_backend_telemetry_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.storage_backend_telemetry_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/storage-backend-telemetry

      - name: Download MinIO bucket CORS verification
        if: ${{ steps.artifact_inputs.outputs.minio_bucket_cors_run_id != '' && steps.artifact_inputs.outputs.minio_bucket_cors_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.minio_bucket_cors_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.minio_bucket_cors_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/minio-bucket-cors

      - name: Download monitoring threshold evidence
        if: ${{ steps.artifact_inputs.outputs.monitoring_threshold_run_id != '' && steps.artifact_inputs.outputs.monitoring_threshold_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.monitoring_threshold_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.monitoring_threshold_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/monitoring-threshold

      - name: Download secret rotation evidence
        if: ${{ steps.artifact_inputs.outputs.secret_rotation_run_id != '' && steps.artifact_inputs.outputs.secret_rotation_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.secret_rotation_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.secret_rotation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/secret-rotation

      - name: Download cluster network access review evidence
        if: ${{ steps.artifact_inputs.outputs.cluster_network_access_review_run_id != '' && steps.artifact_inputs.outputs.cluster_network_access_review_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.cluster_network_access_review_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.cluster_network_access_review_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/cluster-network-access-review

      - name: Download Helm values hardening evidence
        if: ${{ steps.artifact_inputs.outputs.helm_values_hardening_run_id != '' && steps.artifact_inputs.outputs.helm_values_hardening_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.helm_values_hardening_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.helm_values_hardening_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/helm-values-hardening

      - name: Download support escalation handoff evidence
        if: ${{ steps.artifact_inputs.outputs.support_escalation_handoff_run_id != '' && steps.artifact_inputs.outputs.support_escalation_handoff_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.support_escalation_handoff_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.support_escalation_handoff_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/support-escalation-handoff

      - name: Download commercial integration evidence
        if: ${{ steps.artifact_inputs.outputs.commercial_integration_run_id != '' && steps.artifact_inputs.outputs.commercial_integration_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.commercial_integration_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.commercial_integration_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/commercial-integration

      - name: Download commercial approval evidence
        if: ${{ steps.artifact_inputs.outputs.commercial_approval_run_id != '' && steps.artifact_inputs.outputs.commercial_approval_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.commercial_approval_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.commercial_approval_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/commercial-approval
      - name: Download chargeback closeout evidence
        if: ${{ steps.artifact_inputs.outputs.chargeback_closeout_run_id != '' && steps.artifact_inputs.outputs.chargeback_closeout_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.chargeback_closeout_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.chargeback_closeout_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/chargeback-closeout


      - name: Download enterprise auth smoke evidence
        if: ${{ steps.artifact_inputs.outputs.enterprise_auth_run_id != '' && steps.artifact_inputs.outputs.enterprise_auth_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.enterprise_auth_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.enterprise_auth_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/enterprise-auth

      - name: Download enterprise auth JIT rollback evidence
        if: ${{ steps.artifact_inputs.outputs.enterprise_auth_jit_rollback_run_id != '' && steps.artifact_inputs.outputs.enterprise_auth_jit_rollback_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.enterprise_auth_jit_rollback_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.enterprise_auth_jit_rollback_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/enterprise-auth-jit-rollback
      - name: Download operations handoff package evidence
        if: ${{ steps.artifact_inputs.outputs.operations_handoff_package_run_id != '' && steps.artifact_inputs.outputs.operations_handoff_package_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.operations_handoff_package_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.operations_handoff_package_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/operations-handoff-package

      - name: Download data-flow storage plan evidence
        if: ${{ steps.artifact_inputs.outputs.data_flow_storage_plan_run_id != '' && steps.artifact_inputs.outputs.data_flow_storage_plan_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.data_flow_storage_plan_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.data_flow_storage_plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/data-flow-storage-plan

      - name: Download data-flow query/retention budget evidence
        if: ${{ steps.artifact_inputs.outputs.data_flow_query_retention_budget_run_id != '' && steps.artifact_inputs.outputs.data_flow_query_retention_budget_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.data_flow_query_retention_budget_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.data_flow_query_retention_budget_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/data-flow-query-retention-budget

      - name: Download data-flow storage transition runbook evidence
        if: ${{ steps.artifact_inputs.outputs.data_flow_storage_transition_runbook_run_id != '' && steps.artifact_inputs.outputs.data_flow_storage_transition_runbook_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.data_flow_storage_transition_runbook_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.data_flow_storage_transition_runbook_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/data-flow-storage-transition-runbook

      - name: Download Kubernetes operations report sync evidence
        if: ${{ steps.artifact_inputs.outputs.kubernetes_operations_report_sync_run_id != '' && steps.artifact_inputs.outputs.kubernetes_operations_report_sync_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_inputs.outputs.kubernetes_operations_report_sync_artifact_name }}
          run-id: ${{ steps.artifact_inputs.outputs.kubernetes_operations_report_sync_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .osmu-run/operations-readiness-artifacts/kubernetes-operations-report-sync

      - name: Import downloaded evidence artifacts
        shell: pwsh
        run: |
          $importArgs = @(
            "-OutputDirectory", ".osmu-run",
            "-JsonOutputPath", ".osmu-run/latest-operations-readiness-artifact-import.json",
            "-MarkdownOutputPath", ".osmu-run/latest-operations-readiness-artifact-import.md"
          )
          $artifactRoots = @(
            @("StorageExpansionArtifactPath", ".osmu-run/operations-readiness-artifacts/storage-expansion"),
            @("HaDrReadinessArtifactPath", ".osmu-run/operations-readiness-artifacts/ha-dr-readiness"),
            @("KubernetesDrArtifactPath", ".osmu-run/operations-readiness-artifacts/kubernetes-dr"),
            @("IamRbacArtifactPath", ".osmu-run/operations-readiness-artifacts/iam-rbac"),
            @("SecurityEvidenceArtifactPath", ".osmu-run/operations-readiness-artifacts/security-evidence"),
            @("StorageBackendTelemetryArtifactPath", ".osmu-run/operations-readiness-artifacts/storage-backend-telemetry"),
            @("MinioBucketCorsArtifactPath", ".osmu-run/operations-readiness-artifacts/minio-bucket-cors"),
            @("MonitoringThresholdArtifactPath", ".osmu-run/operations-readiness-artifacts/monitoring-threshold"),
            @("SecretRotationArtifactPath", ".osmu-run/operations-readiness-artifacts/secret-rotation"),
            @("ClusterNetworkAccessReviewArtifactPath", ".osmu-run/operations-readiness-artifacts/cluster-network-access-review"),
            @("HelmValuesHardeningArtifactPath", ".osmu-run/operations-readiness-artifacts/helm-values-hardening"),
            @("SupportEscalationHandoffArtifactPath", ".osmu-run/operations-readiness-artifacts/support-escalation-handoff"),
            @("CommercialIntegrationArtifactPath", ".osmu-run/operations-readiness-artifacts/commercial-integration"),
            @("CommercialApprovalArtifactPath", ".osmu-run/operations-readiness-artifacts/commercial-approval"),
            @("ChargebackCloseoutArtifactPath", ".osmu-run/operations-readiness-artifacts/chargeback-closeout"),
            @("EnterpriseAuthArtifactPath", ".osmu-run/operations-readiness-artifacts/enterprise-auth"),
            @("EnterpriseAuthJitRollbackArtifactPath", ".osmu-run/operations-readiness-artifacts/enterprise-auth-jit-rollback"),
            @("OperationsHandoffPackageArtifactPath", ".osmu-run/operations-readiness-artifacts/operations-handoff-package"),
            @("KubernetesOperationsReportSyncArtifactPath", ".osmu-run/operations-readiness-artifacts/kubernetes-operations-report-sync"),
            @("DataFlowStoragePlanArtifactPath", ".osmu-run/operations-readiness-artifacts/data-flow-storage-plan"),
            @("DataFlowQueryRetentionBudgetArtifactPath", ".osmu-run/operations-readiness-artifacts/data-flow-query-retention-budget"),
            @("DataFlowStorageTransitionRunbookArtifactPath", ".osmu-run/operations-readiness-artifacts/data-flow-storage-transition-runbook")
          )
          foreach ($artifactRoot in $artifactRoots) {
            if (Test-Path -LiteralPath $artifactRoot[1]) {
              $importArgs += @("-$($artifactRoot[0])", $artifactRoot[1])
            }
          }
          ./scripts/import-operations-readiness-artifacts.ps1 @importArgs

      - name: Write operations readiness report
        shell: pwsh
        run: |
          $readinessArgs = @()
          if ("${{ inputs.fail_if_not_ready }}" -eq "true") {
            $readinessArgs += "-FailIfNotReady"
          }
          ./scripts/write-operations-readiness.ps1 @readinessArgs

      - name: Upload operations readiness artifact set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-readiness-artifacts-${{ github.run_id }}
          path: |
            .osmu-run/latest-operations-readiness-artifact-import.json
            .osmu-run/latest-operations-readiness-artifact-import.md
            .osmu-run/latest-operations-readiness.json
            .osmu-run/latest-operations-readiness.md
            .osmu-run/latest-storage-expansion-finalize.json
            .osmu-run/latest-storage-expansion-finalize.md
            .osmu-run/latest-storage-expansion-rbac-auth.json
            .osmu-run/latest-storage-expansion-server-dry-run.json
            .osmu-run/latest-kubernetes-ha-dr-readiness.json
            .osmu-run/latest-kubernetes-dr-finalize.json
            .osmu-run/latest-kubernetes-dr-finalize.md
            .osmu-run/latest-kubernetes-dr-drill.json
            .osmu-run/latest-kubernetes-restore-smoke.json
            .osmu-run/latest-kubernetes-dr-evidence-request.json
            .osmu-run/latest-iam-rbac-finalize.json
            .osmu-run/latest-iam-rbac-finalize.md
            .osmu-run/latest-security-evidence-finalize.json
            .osmu-run/latest-security-evidence-finalize.md
            .osmu-run/latest-image-signing-evidence.json
            .osmu-run/latest-container-security-evidence.json
            .osmu-run/latest-storage-backend-telemetry.json
            .osmu-run/latest-storage-backend-telemetry.md
            .osmu-run/latest-minio-bucket-cors-verification.json
            .osmu-run/latest-minio-bucket-cors-verification.md
            .osmu-run/latest-monitoring-threshold-evidence.json
            .osmu-run/latest-monitoring-threshold-evidence.md
            .osmu-run/latest-secret-rotation-evidence.json
            .osmu-run/latest-secret-rotation-evidence.md
            .osmu-run/latest-cluster-network-access-review-evidence.json
            .osmu-run/latest-cluster-network-access-review-evidence.md
            .osmu-run/latest-helm-values-hardening-evidence.json
            .osmu-run/latest-helm-values-hardening-evidence.md
            .osmu-run/latest-support-escalation-handoff-evidence.json
            .osmu-run/latest-support-escalation-handoff-evidence.md
            .osmu-run/latest-commercial-integration-evidence.json
            .osmu-run/latest-commercial-integration-evidence.md
            .osmu-run/latest-commercial-approval-evidence.json
            .osmu-run/latest-commercial-approval-evidence.md
            .osmu-run/latest-chargeback-closeout-evidence.json
            .osmu-run/latest-chargeback-closeout-evidence.md
            .osmu-run/latest-enterprise-auth-smoke.json
            .osmu-run/latest-enterprise-auth-smoke.md
            .osmu-run/latest-enterprise-auth-jit-rollback-evidence.json
            .osmu-run/latest-enterprise-auth-jit-rollback-evidence.md
            .osmu-run/latest-operations-handoff-package.json
            .osmu-run/latest-operations-handoff-package.md
            .osmu-run/latest-kubernetes-operations-report-sync.json
            .osmu-run/latest-kubernetes-operations-report-sync-plan.json
            .osmu-run/latest-kubernetes-operations-report-sync-server-dry-run.json
            .osmu-run/latest-data-flow-storage-plan.json
            .osmu-run/latest-data-flow-query-retention-budget-evidence.json
            .osmu-run/latest-data-flow-query-retention-budget-evidence.md
            .osmu-run/latest-data-flow-storage-transition-runbook-evidence.json
            .osmu-run/latest-data-flow-storage-transition-runbook-evidence.md
            .osmu-run/operations-readiness-artifacts/**
          if-no-files-found: warn
