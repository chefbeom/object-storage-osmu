name: Manual Commercial Integration Evidence

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Target environment label
        required: true
        default: prod
      target_cluster:
        description: Target cluster label
        required: true
        default: osmu-prod
      operator:
        description: Operator or team recording the evidence
        required: true
        default: ""
      verification_started_at:
        description: Verification start time in ISO-8601 format
        required: true
        default: ""
      verification_completed_at:
        description: Verification completion time in ISO-8601 format
        required: true
        default: ""
      change_approval_ref:
        description: External change approval reference
        required: true
        default: ""
      payment_provider_adapter_readiness_json_base64:
        description: Base64 JSON from GET /api/admin/billing/payment-provider-adapter-readiness
        required: false
        default: ""
      commercial_evidence_payload_json_base64:
        description: Optional base64 JSON containing payment_provider_adapter_readiness_evidence_ref, adapter evidence refs, delivery confirmations, and review confirmations
        required: false
        default: ""
      require_all_implemented_adapters:
        description: Require every implemented notification/payment handoff adapter
        required: true
        type: boolean
        default: true
      fail_if_not_passed:
        description: Fail workflow when evidence result is not passed
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: manual-commercial-integration-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commercial-integration-evidence:
    name: Manual commercial integration evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record commercial integration evidence
        shell: pwsh
        env:
          OSMU_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          OSMU_TARGET_CLUSTER: ${{ inputs.target_cluster }}
          OSMU_OPERATOR: ${{ inputs.operator }}
          OSMU_VERIFICATION_STARTED_AT: ${{ inputs.verification_started_at }}
          OSMU_VERIFICATION_COMPLETED_AT: ${{ inputs.verification_completed_at }}
          OSMU_CHANGE_APPROVAL_REF: ${{ inputs.change_approval_ref }}
          OSMU_PAYMENT_PROVIDER_ADAPTER_READINESS_JSON_BASE64: ${{ inputs.payment_provider_adapter_readiness_json_base64 }}
          OSMU_COMMERCIAL_EVIDENCE_PAYLOAD_JSON_BASE64: ${{ inputs.commercial_evidence_payload_json_base64 }}
          OSMU_REQUIRE_ALL_IMPLEMENTED_ADAPTERS: ${{ inputs.require_all_implemented_adapters }}
          OSMU_FAIL_IF_NOT_PASSED: ${{ inputs.fail_if_not_passed }}
        run: |
          $readinessJsonPath = ""
          try {
            $payload = [pscustomobject]@{}
            if (-not [string]::IsNullOrWhiteSpace($env:OSMU_COMMERCIAL_EVIDENCE_PAYLOAD_JSON_BASE64)) {
              $payloadText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:OSMU_COMMERCIAL_EVIDENCE_PAYLOAD_JSON_BASE64))
              $payload = $payloadText | ConvertFrom-Json
            }

            function Get-PayloadString([string] $Name) {
              $property = $payload.PSObject.Properties[$Name]
              if ($null -eq $property -or $null -eq $property.Value) {
                return ""
              }
              return [string] $property.Value
            }

            function Test-PayloadTrue([string] $Name, [bool] $Default = $false) {
              $property = $payload.PSObject.Properties[$Name]
              if ($null -eq $property -or $null -eq $property.Value) {
                return $Default
              }
              if ($property.Value -is [bool]) {
                return [bool] $property.Value
              }
              return [string] $property.Value -eq "true"
            }

            if (-not [string]::IsNullOrWhiteSpace($env:OSMU_PAYMENT_PROVIDER_ADAPTER_READINESS_JSON_BASE64)) {
              New-Item -ItemType Directory -Force -Path ".osmu-run" | Out-Null
              $readinessJsonPath = ".osmu-run/payment-provider-adapter-readiness.json"
              $resolvedReadinessJsonPath = Join-Path (Resolve-Path ".").Path $readinessJsonPath
              [System.IO.File]::WriteAllBytes($resolvedReadinessJsonPath, [Convert]::FromBase64String($env:OSMU_PAYMENT_PROVIDER_ADAPTER_READINESS_JSON_BASE64))
            }

            $evidenceArgs = @(
              "-EnvironmentName", $env:OSMU_ENVIRONMENT_NAME,
              "-TargetCluster", $env:OSMU_TARGET_CLUSTER,
              "-Operator", $env:OSMU_OPERATOR,
              "-VerificationStartedAt", $env:OSMU_VERIFICATION_STARTED_AT,
              "-VerificationCompletedAt", $env:OSMU_VERIFICATION_COMPLETED_AT,
              "-ChangeApprovalRef", $env:OSMU_CHANGE_APPROVAL_REF,
              "-NotificationWebhookEvidenceRef", (Get-PayloadString "notification_webhook_evidence_ref"),
              "-SlackWebhookEvidenceRef", (Get-PayloadString "slack_webhook_evidence_ref"),
              "-EmailSmtpEvidenceRef", (Get-PayloadString "email_smtp_evidence_ref"),
              "-PaymentGenericWebhookEvidenceRef", (Get-PayloadString "payment_generic_webhook_evidence_ref"),
              "-PaymentCardProfileEvidenceRef", (Get-PayloadString "payment_card_profile_evidence_ref"),
              "-PaymentBankProfileEvidenceRef", (Get-PayloadString "payment_bank_profile_evidence_ref"),
              "-PaymentTaxProfileEvidenceRef", (Get-PayloadString "payment_tax_profile_evidence_ref"),
              "-PaymentErpProfileEvidenceRef", (Get-PayloadString "payment_erp_profile_evidence_ref"),
              "-PaymentProviderAdapterReadinessEvidenceRef", (Get-PayloadString "payment_provider_adapter_readiness_evidence_ref"),
              "-AdapterRetryWorkerEvidenceRef", (Get-PayloadString "adapter_retry_worker_evidence_ref"),
              "-PayloadReviewEvidenceRef", (Get-PayloadString "payload_review_evidence_ref"),
              "-PrivateNetworkBlockEvidenceRef", (Get-PayloadString "private_network_block_evidence_ref"),
              "-HmacSignatureEvidenceRef", (Get-PayloadString "hmac_signature_evidence_ref"),
              "-JsonOutputPath", ".osmu-run/latest-commercial-integration-evidence.json",
              "-MarkdownOutputPath", ".osmu-run/latest-commercial-integration-evidence.md"
            )

            if (-not [string]::IsNullOrWhiteSpace($readinessJsonPath)) { $evidenceArgs += @("-PaymentProviderAdapterReadinessJsonPath", $readinessJsonPath) }
            if (Test-PayloadTrue "verified_notification_webhook") { $evidenceArgs += "-VerifiedNotificationWebhook" }
            if (Test-PayloadTrue "verified_slack_webhook") { $evidenceArgs += "-VerifiedSlackWebhook" }
            if (Test-PayloadTrue "verified_email_smtp") { $evidenceArgs += "-VerifiedEmailSmtp" }
            if (Test-PayloadTrue "verified_payment_generic_webhook") { $evidenceArgs += "-VerifiedPaymentGenericWebhook" }
            if (Test-PayloadTrue "verified_payment_card_profile") { $evidenceArgs += "-VerifiedPaymentCardProfile" }
            if (Test-PayloadTrue "verified_payment_bank_profile") { $evidenceArgs += "-VerifiedPaymentBankProfile" }
            if (Test-PayloadTrue "verified_payment_tax_profile") { $evidenceArgs += "-VerifiedPaymentTaxProfile" }
            if (Test-PayloadTrue "verified_payment_erp_profile") { $evidenceArgs += "-VerifiedPaymentErpProfile" }
            if (Test-PayloadTrue "confirm_adapter_retry_worker_run") { $evidenceArgs += "-ConfirmAdapterRetryWorkerRun" }
            if (Test-PayloadTrue "confirm_payload_size_caps") { $evidenceArgs += "-ConfirmPayloadSizeCaps" }
            if (Test-PayloadTrue "confirm_private_network_blocking") { $evidenceArgs += "-ConfirmPrivateNetworkBlocking" }
            if (Test-PayloadTrue "confirm_hmac_signature_headers") { $evidenceArgs += "-ConfirmHmacSignatureHeaders" }
            if (Test-PayloadTrue "confirm_payment_provider_adapter_readiness_reviewed") { $evidenceArgs += "-ConfirmPaymentProviderAdapterReadinessReviewed" }
            if (Test-PayloadTrue "confirm_no_secret_values") { $evidenceArgs += "-ConfirmNoSecretValues" }
            if (Test-PayloadTrue "confirm_no_raw_provider_responses") { $evidenceArgs += "-ConfirmNoRawProviderResponses" }
            if (Test-PayloadTrue "require_all_implemented_adapters" ($env:OSMU_REQUIRE_ALL_IMPLEMENTED_ADAPTERS -eq "true")) { $evidenceArgs += "-RequireAllImplementedAdapters" }
            if ($env:OSMU_FAIL_IF_NOT_PASSED -eq "true") { $evidenceArgs += "-FailIfNotPassed" }

            ./scripts/write-commercial-integration-evidence.ps1 @evidenceArgs
          }
          finally {
            if (-not [string]::IsNullOrWhiteSpace($readinessJsonPath)) {
              Remove-Item -LiteralPath $readinessJsonPath -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Upload commercial integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-integration-evidence-${{ github.run_id }}
          path: |
            .osmu-run/latest-commercial-integration-evidence.json
            .osmu-run/latest-commercial-integration-evidence.md
          if-no-files-found: error
          retention-days: 14
