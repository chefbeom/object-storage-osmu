name: Image Publish and Sign CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release image version, for example v0.1.0-rc.1
        required: true
        type: string
      publish:
        description: Push and sign images
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: image-publish-sign-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-publish-sign:
    name: Build, publish, and sign images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        shell: bash
        run: |
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "BACKEND_IMAGE=${REGISTRY}/${owner_lc}/osmu-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${REGISTRY}/${owner_lc}/osmu-frontend" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: inputs.publish == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Build backend image
        run: |
          docker build \
            -t "$BACKEND_IMAGE:${{ inputs.version }}" \
            -t "$BACKEND_IMAGE:${{ github.sha }}" \
            ./osmu-backend

      - name: Build frontend image
        run: |
          docker build \
            -t "$FRONTEND_IMAGE:${{ inputs.version }}" \
            -t "$FRONTEND_IMAGE:${{ github.sha }}" \
            ./osmu-frontend

      - name: Push images
        if: inputs.publish == 'true'
        run: |
          docker push "$BACKEND_IMAGE:${{ inputs.version }}"
          docker push "$BACKEND_IMAGE:${{ github.sha }}"
          docker push "$FRONTEND_IMAGE:${{ inputs.version }}"
          docker push "$FRONTEND_IMAGE:${{ github.sha }}"

      - name: Sign images
        if: inputs.publish == 'true'
        run: |
          cosign sign --yes "$BACKEND_IMAGE:${{ inputs.version }}"
          cosign sign --yes "$BACKEND_IMAGE:${{ github.sha }}"
          cosign sign --yes "$FRONTEND_IMAGE:${{ inputs.version }}"
          cosign sign --yes "$FRONTEND_IMAGE:${{ github.sha }}"

      - name: Verify signatures
        if: inputs.publish == 'true'
        run: |
          cosign verify "$BACKEND_IMAGE:${{ inputs.version }}" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          cosign verify "$FRONTEND_IMAGE:${{ inputs.version }}" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
