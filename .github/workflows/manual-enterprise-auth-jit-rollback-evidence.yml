name: Manual Enterprise Auth JIT Rollback Evidence

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Target environment label
        required: true
        default: prod
      target_cluster:
        description: Target cluster label
        required: true
        default: osmu-prod
      operator:
        description: Operator or team recording the evidence
        required: true
        default: ""
      review_started_at:
        description: Review start time in ISO-8601 format
        required: true
        default: ""
      review_completed_at:
        description: Review completion time in ISO-8601 format
        required: true
        default: ""
      change_approval_ref:
        description: External change approval reference
        required: true
        default: ""
      enterprise_auth_smoke_json_base64:
        description: Base64 latest-enterprise-auth-smoke.json target smoke or scope-out snapshot
        required: false
        default: ""
      jit_rollback_payload_json_base64:
        description: Optional base64 JSON containing JIT rollback evidence refs and confirmations
        required: false
        default: ""
      require_enterprise_auth_smoke_evidence:
        description: Require target enterprise auth smoke or accepted scope-out snapshot
        required: true
        type: boolean
        default: true
      fail_if_not_passed:
        description: Fail workflow when evidence result is not passed
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: manual-enterprise-auth-jit-rollback-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enterprise-auth-jit-rollback-evidence:
    name: Manual enterprise auth JIT rollback evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record enterprise auth JIT rollback evidence
        shell: pwsh
        env:
          OSMU_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          OSMU_TARGET_CLUSTER: ${{ inputs.target_cluster }}
          OSMU_OPERATOR: ${{ inputs.operator }}
          OSMU_REVIEW_STARTED_AT: ${{ inputs.review_started_at }}
          OSMU_REVIEW_COMPLETED_AT: ${{ inputs.review_completed_at }}
          OSMU_CHANGE_APPROVAL_REF: ${{ inputs.change_approval_ref }}
          OSMU_ENTERPRISE_AUTH_SMOKE_JSON_BASE64: ${{ inputs.enterprise_auth_smoke_json_base64 }}
          OSMU_JIT_ROLLBACK_PAYLOAD_JSON_BASE64: ${{ inputs.jit_rollback_payload_json_base64 }}
          OSMU_REQUIRE_ENTERPRISE_AUTH_SMOKE_EVIDENCE: ${{ inputs.require_enterprise_auth_smoke_evidence }}
          OSMU_FAIL_IF_NOT_PASSED: ${{ inputs.fail_if_not_passed }}
        run: |
          $smokeJsonPath = ""
          try {
            $payload = [pscustomobject]@{}
            if (-not [string]::IsNullOrWhiteSpace($env:OSMU_JIT_ROLLBACK_PAYLOAD_JSON_BASE64)) {
              $payloadText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:OSMU_JIT_ROLLBACK_PAYLOAD_JSON_BASE64))
              $payload = $payloadText | ConvertFrom-Json
            }

            function Get-PayloadString([string] $Name) {
              $property = $payload.PSObject.Properties[$Name]
              if ($null -eq $property -or $null -eq $property.Value) {
                return ""
              }
              return [string] $property.Value
            }

            function Test-PayloadTrue([string] $Name, [bool] $Default = $false) {
              $property = $payload.PSObject.Properties[$Name]
              if ($null -eq $property -or $null -eq $property.Value) {
                return $Default
              }
              if ($property.Value -is [bool]) {
                return [bool] $property.Value
              }
              return [string] $property.Value -eq "true"
            }

            if (-not [string]::IsNullOrWhiteSpace($env:OSMU_ENTERPRISE_AUTH_SMOKE_JSON_BASE64)) {
              New-Item -ItemType Directory -Force -Path ".osmu-run" | Out-Null
              $smokeJsonPath = ".osmu-run/enterprise-auth-smoke-jit-rollback-snapshot.json"
              $resolvedSmokeJsonPath = Join-Path (Resolve-Path ".").Path $smokeJsonPath
              [System.IO.File]::WriteAllBytes($resolvedSmokeJsonPath, [Convert]::FromBase64String($env:OSMU_ENTERPRISE_AUTH_SMOKE_JSON_BASE64))
            }

            $evidenceArgs = @(
              "-EnvironmentName", $env:OSMU_ENVIRONMENT_NAME,
              "-TargetCluster", $env:OSMU_TARGET_CLUSTER,
              "-Operator", $env:OSMU_OPERATOR,
              "-ReviewStartedAt", $env:OSMU_REVIEW_STARTED_AT,
              "-ReviewCompletedAt", $env:OSMU_REVIEW_COMPLETED_AT,
              "-ChangeApprovalRef", $env:OSMU_CHANGE_APPROVAL_REF,
              "-JitProvisionEvidenceRef", (Get-PayloadString "jit_provision_evidence_ref"),
              "-JitRollbackRunbookRef", (Get-PayloadString "jit_rollback_runbook_ref"),
              "-UserDisableRollbackEvidenceRef", (Get-PayloadString "user_disable_rollback_evidence_ref"),
              "-RoleMappingRollbackEvidenceRef", (Get-PayloadString "role_mapping_rollback_evidence_ref"),
              "-LocalLoginFallbackEvidenceRef", (Get-PayloadString "local_login_fallback_evidence_ref"),
              "-AuditReviewEvidenceRef", (Get-PayloadString "audit_review_evidence_ref"),
              "-EvidenceRef", (Get-PayloadString "evidence_ref"),
              "-JsonOutputPath", ".osmu-run/latest-enterprise-auth-jit-rollback-evidence.json",
              "-MarkdownOutputPath", ".osmu-run/latest-enterprise-auth-jit-rollback-evidence.md"
            )

            if (-not [string]::IsNullOrWhiteSpace($smokeJsonPath)) { $evidenceArgs += @("-EnterpriseAuthSmokeJsonPath", $smokeJsonPath) }
            if ($env:OSMU_REQUIRE_ENTERPRISE_AUTH_SMOKE_EVIDENCE -eq "true") { $evidenceArgs += "-RequireEnterpriseAuthSmokeEvidence" }
            if (Test-PayloadTrue "confirm_admin_approval_required") { $evidenceArgs += "-ConfirmAdminApprovalRequired" }
            if (Test-PayloadTrue "confirm_callback_auto_jit_disabled") { $evidenceArgs += "-ConfirmCallbackAutoJitDisabled" }
            if (Test-PayloadTrue "confirm_jit_user_disable_or_lock_rollback_reviewed") { $evidenceArgs += "-ConfirmJitUserDisableOrLockRollbackReviewed" }
            if (Test-PayloadTrue "confirm_role_org_team_rollback_reviewed") { $evidenceArgs += "-ConfirmRoleOrgTeamRollbackReviewed" }
            if (Test-PayloadTrue "confirm_local_password_fallback_validated") { $evidenceArgs += "-ConfirmLocalPasswordFallbackValidated" }
            if (Test-PayloadTrue "confirm_audit_events_reviewed") { $evidenceArgs += "-ConfirmAuditEventsReviewed" }
            if (Test-PayloadTrue "confirm_no_raw_claims") { $evidenceArgs += "-ConfirmNoRawClaims" }
            if (Test-PayloadTrue "confirm_no_secret_values") { $evidenceArgs += "-ConfirmNoSecretValues" }
            if ($env:OSMU_FAIL_IF_NOT_PASSED -eq "true") { $evidenceArgs += "-FailIfNotPassed" }

            ./scripts/write-enterprise-auth-jit-rollback-evidence.ps1 @evidenceArgs
          }
          finally {
            if (-not [string]::IsNullOrWhiteSpace($smokeJsonPath)) {
              Remove-Item -LiteralPath $smokeJsonPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload enterprise auth JIT rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-auth-jit-rollback-evidence-${{ github.run_id }}
          path: |
            .osmu-run/latest-enterprise-auth-jit-rollback-evidence.json
            .osmu-run/latest-enterprise-auth-jit-rollback-evidence.md
          if-no-files-found: error
          retention-days: 14